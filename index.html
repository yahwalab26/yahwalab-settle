<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>야화랩 정산 사이트</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#111;--mute:#7a7a7a;--line:#e6e6e3;--soft:#f7f7f5;--bad:#b3261e;--ok:#1a6b3c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.7 "Pretendard Variable",Pretendard,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}
@keyframes in{from{opacity:0}to{opacity:1}}
section{animation:in .5s ease both}
.wrap{max-width:900px;margin:0 auto;padding:0 24px}#app{padding-bottom:96px}
.logo{display:block;margin:0 auto;height:52px;width:auto;max-width:70%}.wm{font-size:22px;letter-spacing:.02em}
.sub{margin:14px 0 0;font-size:14px;font-weight:600;letter-spacing:.08em;color:var(--ink)}
.foot{margin:56px 0 0;font-size:12px;color:var(--mute);letter-spacing:.02em}
h1{font-size:26px;line-height:1.3;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
h2{margin:60px 0 18px;text-align:center;font-size:22px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
h2 small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:.06em;margin-bottom:6px}
#login,#chpw,#denied{min-height:100vh;min-height:calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:32px 0}
header{display:flex;flex-direction:column;align-items:center;gap:6px;padding:34px 0 20px;border-bottom:1px solid var(--ink);text-align:center}
header .logo{height:36px}header .sub{margin:6px 0 0;font-size:12px}
.who{display:flex;align-items:center;justify-content:center;gap:4px 16px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin-top:8px}
button.lnk{background:none;color:var(--ink);border:0;padding:0;min-height:0;font-size:13px;text-decoration:underline;text-underline-offset:3px}
button.lnk:hover{background:none;color:var(--mute)}
.login{display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;margin:0 auto;text-align:left}
input[type=email],input[type=password],input[type=date],input[type=text],input[type=tel],select{font:inherit;color:var(--ink);background:#fff;border:0;border-bottom:1px solid var(--ink);border-radius:0;padding:12px 2px;width:100%}
input::placeholder{color:#a3a3a3}
input:focus,select:focus{outline:none;border-bottom-width:2px;padding-bottom:11px}
.row input[type=date]{width:auto}.row select{width:auto;max-width:100%}
button{font:inherit;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:12px 22px;border-radius:0;cursor:pointer;letter-spacing:.02em;transition:background .15s,color .15s}
button:hover:not(:disabled){background:#fff;color:var(--ink)}
button:disabled{opacity:.3;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line);padding:7px 14px;font-size:13px}
button.ghost:hover:not(:disabled){border-color:var(--ink)}
.login>button:not(.ghost){margin-top:16px;width:100%}.login>button.ghost{margin-top:4px;width:100%}
.login .chk{align-self:flex-start;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin-top:10px;cursor:pointer;text-align:left}
.login .chk input{width:16px;height:16px;min-height:0;margin:0;padding:0;flex:none;accent-color:var(--ink)}
#le,#ce{min-height:20px;font-size:13px;text-align:center;margin-top:8px}
.drop{display:block;border:1px solid var(--line);background:var(--soft);padding:48px 20px;text-align:center;color:var(--mute);cursor:pointer;transition:all .15s}
.drop b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.drop:hover,.drop.on{border-color:var(--ink);background:#fff}
.card{border:1px solid var(--line);padding:24px;margin-top:16px;text-align:center;background:#fff}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{font-weight:500;color:var(--mute);font-size:12px;letter-spacing:.04em}
.r,th.r{text-align:right}.card th,.card td{text-align:left}.card .r{text-align:right}
.tw td,.tw th{white-space:nowrap}.tw td:first-child{white-space:normal;min-width:130px}
.k{color:var(--mute);font-size:13px}.bad{color:var(--bad)}.ok{color:var(--ok)}
.pre{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:9px 14px;letter-spacing:.05em;word-break:break-all}
@media(max-width:560px){
  .wrap{padding:0 16px}#app{padding-bottom:64px}h2{margin-top:44px;font-size:20px}h1{font-size:23px}.logo{height:46px}
  input[type=email],input[type=password],input[type=date],input[type=text],input[type=tel],select{font-size:16px;min-height:44px}
  button{min-height:44px}button.ghost{min-height:36px}
  .card{padding:16px}.row{gap:8px}.row>select{flex:1 1 100%}.row>button{flex:1 1 auto}
  th,td{font-size:13px}.drop{padding:36px 14px}
}
header .logo{height:36px;width:auto;max-width:none;flex:none;object-fit:contain}
header>div{flex:none;max-width:100%}
.logo{object-fit:contain}
#nav{display:flex;justify-content:center;gap:30px;padding:14px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
#nav a{color:var(--mute);text-decoration:none;font-size:14px;padding:6px 0 10px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
#nav a.on{color:var(--ink);border-color:var(--ink);font-weight:600}
</style></head><body>
<div class="wrap">

<section id="login" hidden>
  <img class="logo" src="https://github.com/yahwalab26/yahwalab/blob/main/assets/img/logo-yahwa.png?raw=true" alt="야화랩 YAHWA LAB"><p class="sub">야화랩 정산 사이트</p>
  <form class="login" id="lf" style="margin:36px auto 0">
    <input id="em" type="email" placeholder="이메일" autocomplete="username" required>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" required>
    <label class="chk"><input id="rm" type="checkbox"> 아이디 저장</label>
    <button>로그인</button><div id="le" class="bad"></div>
  </form>
  <p class="foot">YAHWA LAB · 여성향 웹소설 전문 콘텐츠 레이블</p>
</section>

<section id="chpw" hidden>
  <h1 id="ct">비밀번호 설정</h1><p class="k" id="cs"></p>
  <form class="login" id="cf" style="margin:36px auto 0">
    <input id="np" type="password" placeholder="새 비밀번호 (10자 이상)" autocomplete="new-password" required>
    <input id="np2" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required>
    <button>비밀번호 변경</button><button type="button" class="ghost" id="cc" hidden>취소</button><div id="ce" class="bad"></div>
  </form>
</section>

<section id="denied" hidden>
  <h1>접근 권한이 없습니다</h1>
  <p class="k">이 화면은 관리자 전용입니다. 작가용 화면은 준비 중입니다.</p>
  <button class="ghost out">로그아웃</button>
</section>

<section id="app" hidden>
  <header><div><img class="logo" src="https://github.com/yahwalab26/yahwalab/blob/main/assets/img/logo-yahwa.png?raw=true" alt="야화랩 YAHWA LAB"><p class="sub">야화랩 정산 사이트</p></div>
    <div class="who"><span id="who"></span> <button class="lnk" id="pwb">비밀번호 변경</button> <button class="lnk out">로그아웃</button></div></header>
  <nav id="nav"><a href="#/home" data-r="home">현황</a><a href="#/upload" data-r="upload">업로드</a><a href="#/authors" data-r="authors">작가</a></nav>

  <div class="pg" id="pg-home">
  <h2><small>(01)</small>데이터 현황</h2>
  <div class="tw"><table><thead><tr><th>플랫폼</th><th>단위</th><th>마지막 데이터</th><th>마지막 업로드</th></tr></thead><tbody id="fresh"></tbody></table></div>

  </div>
  <div class="pg" id="pg-upload" hidden>
  <h2><small>(02)</small>판매 데이터 업로드</h2>
  <label class="drop" id="dz"><b>판매 파일 선택</b>엑셀/CSV 파일을 선택하세요 (PC에서는 끌어다 놓기도 가능)<br><span class="k">알라딘 · 예스24 · 교보문고는 파일 형태로 자동 인식됩니다</span>
    <input id="file" type="file" accept=".xlsx,.xls,.csv" hidden></label>
  <div id="prev"></div>

  </div>
  <div class="pg" id="pg-authors" hidden>
  <h2><small>(03)</small>작가 관리</h2>
  <div class="row"><input id="aq" type="text" placeholder="필명 · 이름 · 이메일 검색" style="max-width:300px"><button id="anew">+ 작가 등록</button></div>
  <div class="card" id="afw" hidden><form id="af" class="login" style="max-width:420px;margin:0 auto;gap:10px">
    <p class="k" style="margin:0 0 6px;text-align:center">계약서 기준으로 입력하세요. 개인정보는 서버에서 암호화되어 저장됩니다.</p>
    <input id="f1" type="text" placeholder="실명" autocomplete="off" required>
    <input id="f2" type="tel" placeholder="전화번호" autocomplete="off" required>
    <input id="f3" type="text" placeholder="주소" autocomplete="off" required>
    <input id="f4" type="text" placeholder="은행명" autocomplete="off" required>
    <input id="f5" type="text" placeholder="계좌번호" autocomplete="off" required>
    <input id="f6" type="email" placeholder="로그인용 이메일" autocomplete="off" required>
    <input id="f7" type="text" placeholder="필명 (여러 개면 쉼표로 구분)" autocomplete="off" required>
    <button id="fs">등록하고 설정 링크 만들기</button></form></div>
  <div class="card" id="ares" hidden></div><div class="card" id="adet" hidden></div>
  <div class="tw" style="margin-top:20px"><table><thead><tr><th>필명</th><th>이름</th><th>이메일</th><th class="r">작품</th><th></th></tr></thead><tbody id="alist"></tbody></table></div>
  </div>
</section>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
document.querySelectorAll('.logo').forEach(i=>i.onerror=()=>{i.outerHTML='<b class="wm">야화랩 YAHWA LAB</b>'});
const SB=supabase.createClient('https://wddixxdrndgvjgicwunu.supabase.co','sb_publishable_fIrxIqOmX_-BFpSELdmvXQ_kkYSkaCx');
const $=s=>document.querySelector(s),won=n=>n==null?'-':Number(n).toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const PN={aladin:'알라딘',yes24:'예스24',kyobo:'교보문고'},c=v=>String(v??'').trim();
let S=null,WORKS=[],ISBN={},AUTHORS=[],WA={};

/* ---------- 인증 ---------- */
const view=id=>['login','chpw','denied','app'].forEach(v=>$('#'+v).hidden=v!==id);
document.querySelectorAll('.out').forEach(b=>b.onclick=async()=>{await SB.auth.signOut();view('login')});
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
  const{data,error}=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)return $('#le').textContent='이메일 또는 비밀번호가 올바르지 않습니다.';
  try{$('#rm').checked?localStorage.setItem('yw_email',$('#em').value.trim()):localStorage.removeItem('yw_email')}catch{}
  enter(data.user)};
let ME=null,forced=false;
async function enter(u){ME=u;const{data}=await SB.from('profiles').select('role,must_change_password').eq('id',u.id).maybeSingle();
  if(data?.must_change_password)return askPw(true);
  if(data?.role!=='admin')return view('denied');
  $('#who').textContent=u.email;view('app');loadRefs();loadFresh();route()}
try{const se=localStorage.getItem('yw_email');if(se){$('#em').value=se;$('#rm').checked=true}}catch{}

/* ---------- 비밀번호 설정/변경 ---------- */
function askPw(f){forced=f;$('#ct').textContent=f?'비밀번호 설정':'비밀번호 변경';
  $('#cs').textContent=f?'처음 접속하셨습니다. 앞으로 사용할 비밀번호를 설정해 주세요.':'새 비밀번호를 입력하세요.';
  $('#cc').hidden=f;$('#cf').reset();$('#ce').textContent='';view('chpw')}
$('#pwb').onclick=()=>askPw(false);$('#cc').onclick=()=>enter(ME);
$('#cf').onsubmit=async e=>{e.preventDefault();const a=$('#np').value,m=$('#ce');m.textContent='';
  if(a!==$('#np2').value)return m.textContent='비밀번호 확인이 일치하지 않습니다.';
  if(a.length<10)return m.textContent='10자 이상으로 입력하세요.';
  const{error}=await SB.auth.updateUser({password:a});
  if(error)return m.textContent=/different|same/i.test(error.message)?'기존 비밀번호와 다른 비밀번호를 입력하세요.':error.message;
  await SB.rpc('complete_password_change');enter(ME)};

/* ---------- 메뉴(nav) ---------- */
const PG=['home','upload','authors'];
function route(){const r=location.hash.replace(/^#\/?/,'')||'home',id=PG.includes(r)?r:'home';
  PG.forEach(x=>$('#pg-'+x).hidden=x!==id);document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===id));
  if(id==='authors')loadPeople()}
addEventListener('hashchange',route);

/* ---------- 작가 관리 ---------- */
let PEOPLE=[];
const cpy=async(t,b)=>{await navigator.clipboard.writeText(t);const o=b.textContent;b.textContent='복사됨';setTimeout(()=>b.textContent=o,1200)};
async function call(body){const{data,error}=await SB.functions.invoke('admin-author',{body});
  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch{}return{error:m}}return{data}}
async function loadPeople(){const{data}=await SB.from('persons').select('id,name_masked,email_masked,created_at').order('created_at',{ascending:false});
  PEOPLE=data||[];await loadRefs();renderPeople()}
function renderPeople(){const q=$('#aq').value.trim().toLowerCase();
  const rows=PEOPLE.map(p=>({p,pens:AUTHORS.filter(a=>a.person_id===p.id)})).filter(({p,pens})=>!q||[p.name_masked,p.email_masked,...pens.map(a=>a.pen_name)].join(' ').toLowerCase().includes(q));
  $('#alist').innerHTML=rows.map(({p,pens})=>{const ids=pens.map(a=>a.id),n=Object.values(WA).filter(l=>l.some(i=>ids.includes(i))).length;
    return `<tr><td>${esc(pens.map(a=>a.pen_name).join(', '))||'-'}</td><td>${esc(p.name_masked)}</td><td>${esc(p.email_masked)}</td><td class="r">${n}</td>
    <td style="white-space:nowrap"><button class="ghost" data-pa="view" data-id="${p.id}">정보</button> <button class="ghost" data-pa="pen" data-id="${p.id}">필명 추가</button> <button class="ghost" data-pa="link" data-id="${p.id}">링크 재발급</button></td></tr>`}).join('')||'<tr><td colspan="5" class="k">등록된 작가가 없습니다.</td></tr>'}
$('#aq').oninput=renderPeople;
$('#anew').onclick=()=>{$('#afw').hidden=!$('#afw').hidden};
function showLink(link,msg){const r=$('#ares');
  r.innerHTML=`<b>${msg}</b><p class="k" style="margin:6px 0 12px">아래 링크를 작가에게 직접 전달하세요. 링크를 열면 비밀번호를 설정하게 되며, 만료되면 다시 발급해야 합니다.</p><div class="pre" style="margin-bottom:12px">${esc(link)}</div><button class="ghost" id="cl">링크 복사</button>`;
  r.hidden=false;$('#cl').onclick=e=>cpy(link,e.target)}
function showPii(d){const L={legal_name:'실명',phone:'전화번호',address:'주소',bank_name:'은행',bank_account:'계좌번호',contact_email:'이메일'},r=$('#adet');
  r.innerHTML=`<b>개인정보 (60초 후 자동으로 닫힙니다)</b><table style="margin-top:10px">${Object.entries(L).map(([k,t])=>`<tr><th>${t}</th><td>${esc(d[k])}</td></tr>`).join('')}</table><button class="ghost" id="cx" style="margin-top:12px">닫기</button>`;
  r.hidden=false;const h=()=>{r.hidden=true;r.innerHTML=''};$('#cx').onclick=h;setTimeout(h,60000)}
$('#af').onsubmit=async e=>{e.preventDefault();const g=i=>$('#'+i).value.trim(),b=$('#fs');b.disabled=true;
  const{data,error}=await call({action:'create_person',legal_name:g('f1'),phone:g('f2'),address:g('f3'),bank_name:g('f4'),bank_account:g('f5'),login_email:g('f6'),pen_names:g('f7').split(/[,，]/).map(x=>x.trim()).filter(Boolean)});
  b.disabled=false;if(error)return alert(error);
  if(data.duplicate){$('#ares').innerHTML=`<b class="bad">이미 등록된 작가입니다 (${esc(data.name_masked)})</b><p class="k" style="margin:6px 0 0">실명과 전화번호가 같은 사람이 있습니다. 목록에서 '필명 추가'를 사용하세요.</p>`;$('#ares').hidden=false;return}
  $('#af').reset();$('#afw').hidden=true;showLink(data.link,`${esc(g('f7')||'작가')} 계정을 만들었습니다.`);loadPeople()};
$('#alist').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.id,a=b.dataset.pa;
  if(a==='pen'){const n=(prompt('추가할 필명을 입력하세요')||'').trim();if(!n)return;
    const{error}=await SB.from('authors').insert({pen_name:n,person_id:id});if(error)return alert(error.code==='23505'?'이미 사용 중인 필명입니다.':error.message);return loadPeople()}
  b.disabled=true;const{data,error}=await call(a==='view'?{action:'reveal',person_id:id}:{action:'reissue_link',person_id:id});b.disabled=false;
  if(error)return alert(error);a==='view'?showPii(data):showLink(data.link,'비밀번호 설정 링크를 다시 만들었습니다.')};

(async()=>{const{data:{session}}=await SB.auth.getSession();session?enter(session.user):view('login')})();

async function loadRefs(){const[w,i,a,l]=await Promise.all([SB.from('works').select('id,title').order('title'),
  SB.from('work_identifiers').select('work_id,value').eq('id_type','isbn'),
  SB.from('authors').select('id,pen_name,person_id').order('pen_name'),SB.from('work_authors').select('work_id,author_id')]);
  WORKS=w.data||[];ISBN={};(i.data||[]).forEach(x=>ISBN[x.value]=x.work_id);
  AUTHORS=a.data||[];WA={};(l.data||[]).forEach(x=>(WA[x.work_id]??=[]).push(x.author_id))}
async function loadFresh(){const{data}=await SB.from('v_data_freshness').select('*').order('platform_code');
  $('#fresh').innerHTML=(data||[]).map(r=>`<tr><td>${esc(r.platform_name)}</td><td>${r.granularity==='monthly'?'월 집계':'일별'}</td>
  <td>${r.last_sale_date||(r.last_sale_month?r.last_sale_month.slice(0,7):'-')}</td>
  <td>${r.last_uploaded_at?new Date(r.last_uploaded_at).toLocaleString('ko-KR'):'-'}</td></tr>`).join('')}

/* ---------- 파일 읽기 ---------- */
function parseCSV(t){const R=[];let r=[],f='',i=0,n=t.length;
  while(i<n){
    if(t[i]=='"'){i++;f='';while(i<n){if(t[i]=='"'){if(t[i+1]=='"'){f+='"';i+=2}else{i++;break}}else f+=t[i++]}}
    else{f='';while(i<n&&t[i]!=','&&t[i]!='\n'&&t[i]!='\r')f+=t[i++]}
    r.push(f);
    if(t[i]==','){i++;if(i>=n||t[i]=='\n'||t[i]=='\r')r.push('');continue}
    if(t[i]=='\r')i++;if(t[i]=='\n')i++;R.push(r);r=[]}
  if(r.length)R.push(r);return R}
const decode=b=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b).replace(/^\uFEFF/,'')}catch{return new TextDecoder('euc-kr').decode(b)}};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');

const num=v=>{const s=c(v).replace(/,/g,'');if(s==='')return null;const n=Number(s);if(isNaN(n))throw `숫자가 아님: ${s}`;return Math.round(n)};
const isbn=v=>c(v).replace(/^=T\("?/,'').replace(/"?\)$/,'').replace(/\.0$/,'');
function dt(v){let y,mo,d,h=0,mi=0,s=0;
  if(typeof v==='number'){const D=new Date(Math.round((v-25569)*864e5));[y,mo,d,h,mi,s]=[D.getUTCFullYear(),D.getUTCMonth()+1,D.getUTCDate(),D.getUTCHours(),D.getUTCMinutes(),D.getUTCSeconds()]}
  else{const m=c(v).match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);if(!m)throw `날짜 형식 오류: ${c(v)}`;
    [y,mo,d]=[+m[1],+m[2],+m[3]];h=+(m[4]||0);mi=+(m[5]||0);s=+(m[6]||0)}
  const p=x=>String(x).padStart(2,'0'),date=`${y}-${p(mo)}-${p(d)}`;
  return{ts:`${date}T${p(h)}:${p(mi)}:${p(s)}+09:00`,date,month:`${y}-${p(mo)}-01`}}

function detect(rows){for(let i=0;i<Math.min(rows.length,10);i++){const h=rows[i].map(c);
  if(h.includes('판매/취소일시')&&h.includes('ItemId'))return['aladin',i];
  if(h.includes('출판사정산액')&&h.includes('판매서점'))return['yes24',i];
  if(h.includes('판매기간')&&h.includes('판매금액'))return['kyobo',i]}return[null,0]}

function parse(rows,p,hi){
  const h=rows[hi].map(c),g=(r,k)=>r[h.indexOf(k)],L=[],E=[];let total=null;
  rows.slice(hi+1).forEach((r,n)=>{
    if(!r.some(x=>c(x)!==''))return;
    const raw={};h.forEach((k,i)=>{const v=c(r[i]);if(k&&v!=='')raw[k]=v});
    try{
      if(p==='kyobo'){const per=c(g(r,'판매기간'));
        if(per==='합계'){total=num(g(r,'판매금액'));return}
        if(!/^\d{4}-\d{2}$/.test(per))throw `판매기간 형식 오류: ${per}`;
        L.push({isbn:isbn(g(r,'epub isbn')),title:c(g(r,'상품명')),author:c(g(r,'저자명')),granularity:'monthly',line_type:'sale',sale_date:null,sale_month:per+'-01',
          channel:c(g(r,'판매채널')),sale_method:c(g(r,'판매방식')),quantity:num(g(r,'판매수량')),list_price:num(g(r,'정가')),
          sale_price:num(g(r,'판매가')),gross_amount:num(g(r,'판매금액')),net_amount:null,raw});return}
      let refund,when,orig=null,list,sale,net,ik,title;
      if(p==='aladin'){const f=c(g(r,'판매형태'));if(f!=='판매'&&f!=='취소')throw `알 수 없는 판매형태: ${f}`;
        refund=f==='취소';when=dt(g(r,'판매/취소일시'));if(c(g(r,'원주문일시'))!=='')orig=dt(g(r,'원주문일시')).ts;
        list=g(r,'정가');sale=g(r,'판매가');net=g(r,'정산액');ik=g(r,'ISBN');title=g(r,'제목')}
      else{const f=c(g(r,'판매구분')),rf=c(g(r,'환불일'));refund=rf!==''||/환불|취소/.test(f);
        if(!refund&&f!=='구매')throw `알 수 없는 판매구분: ${f}`;
        when=dt(refund&&rf!==''?g(r,'환불일'):g(r,'판매일'));if(refund&&c(g(r,'판매일'))!=='')orig=dt(g(r,'판매일')).ts;
        list=g(r,'출판사판매가');sale=g(r,'서점판매가');net=g(r,'출판사정산액');ik=g(r,'전자책ISBN');title=g(r,'도서명')}
      const q=refund?-1:1,sp=Math.abs(num(sale)),nt=num(net);if(nt==null)throw '정산액 없음';
      L.push({isbn:isbn(ik),title:c(title),author:c(g(r,'저자명')),granularity:'transaction',line_type:refund?'refund':'sale',sold_at:when.ts,sale_date:when.date,
        sale_month:when.month,original_sold_at:orig,quantity:q,list_price:num(list),sale_price:sp,gross_amount:q*sp,net_amount:q*Math.abs(nt),raw});
    }catch(e){E.push(`${hi+n+2}행: ${e}`)}});
  if(p==='kyobo'&&total!=null){const s=L.reduce((a,l)=>a+l.gross_amount,0);if(s!==total)E.push(`합계 불일치: 행 합 ${won(s)} ≠ 파일의 합계 ${won(total)}`)}
  L.forEach((l,i)=>{if(!/^\d{13}$/.test(l.isbn))E.push(`ISBN 인식 실패: "${l.isbn}" (${l.title})`)});
  return{L,E,total}}

/* ---------- 업로드 화면 ---------- */
const dz=$('#dz'),fi=$('#file');
fi.onchange=()=>fi.files[0]&&handle(fi.files[0]);
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');e.dataTransfer.files[0]&&handle(e.dataTransfer.files[0])};

async function handle(f){
  $('#prev').innerHTML='<p class="k">파일을 읽는 중…</p>';
  try{const buf=await f.arrayBuffer(),sha=hex(await crypto.subtle.digest('SHA-256',buf));
    const rows=/\.csv$/i.test(f.name)?parseCSV(decode(buf)):(()=>{const wb=XLSX.read(buf,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''})})();
    const[p,hi]=detect(rows);if(!p)return $('#prev').innerHTML='<div class="card bad">알라딘 · 예스24 · 교보문고 양식으로 인식되지 않았습니다. 파일을 확인해 주세요.</div>';
    const{L,E}=parse(rows,p,hi),D=L.map(l=>l.sale_date||l.sale_month).sort();
    let ps=D[0],pe=D[D.length-1];
    if(p==='kyobo'&&D.length){const[y,m]=pe.split('-').map(Number);pe=`${y}-${String(m).padStart(2,'0')}-${String(new Date(Date.UTC(y,m,0)).getUTCDate()).padStart(2,'0')}`}
    S={p,name:f.name,sha,lines:L,errs:E,ps,pe};render()}
  catch(e){$('#prev').innerHTML=`<div class="card bad">파일을 읽지 못했습니다: ${esc(e.message||e)}</div>`}}

const unmatched=()=>{const m={};S.lines.forEach(l=>{if(/^\d{13}$/.test(l.isbn)&&!ISBN[l.isbn])m[l.isbn]??=l.title});return m};
const inRange=()=>S.lines.every(l=>S.p==='kyobo'?(l.sale_month>=S.ps.slice(0,7)+'-01'&&l.sale_month<=S.pe.slice(0,7)+'-01'):(l.sale_date>=S.ps&&l.sale_date<=S.pe));

function render(){
  const s=S,U=unmatched(),gross=s.lines.reduce((a,l)=>a+l.gross_amount,0),net=s.p==='kyobo'?null:s.lines.reduce((a,l)=>a+l.net_amount,0);
  const by={};s.lines.forEach(l=>{const k=l.isbn;by[k]??={t:l.title,a:l.author,q:0,g:0};by[k].q+=l.quantity;by[k].g+=l.gross_amount});
  const range=s.ps&&s.pe&&s.ps<=s.pe&&inRange(),ok=!s.errs.length&&!Object.keys(U).length&&range&&s.lines.length;
  $('#prev').innerHTML=`<div class="card">
    <div class="row"><b>${PN[s.p]}</b><span class="k">${esc(s.name)}</span></div>
    <div class="tw"><table style="margin-top:12px"><thead><tr><th>작품</th><th>작가</th><th class="r">수량</th><th class="r">판매금액</th></tr></thead><tbody>
    ${Object.entries(by).map(([k,v])=>`<tr><td>${esc(ISBN[k]?(WORKS.find(w=>w.id===ISBN[k])||{}).title:v.t)} ${ISBN[k]?'':'<span class="bad">· 미등록</span>'}</td><td>${authCell(k,v.a)}</td><td class="r">${v.q}</td><td class="r">${won(v.g)}</td></tr>`).join('')}
    <tr><td><b>합계 ${s.lines.length}행</b></td><td></td><td></td><td class="r"><b>${won(gross)}</b></td></tr></tbody></table></div>
    <p class="k" style="margin:10px 0 0">${net==null?'교보문고는 정산액이 파일에 없어 정산율로 계산됩니다.':`CP 정산액 합계 ${won(net)}`}</p></div>
  ${s.errs.length?`<div class="card bad"><b>오류 ${s.errs.length}건 — 수정 후 다시 올려주세요</b><br>${s.errs.slice(0,8).map(esc).join('<br>')}${s.errs.length>8?'<br>…':''}</div>`:''}
  ${Object.keys(U).length?`<div class="card"><b>미등록 작품 ${Object.keys(U).length}건</b><p class="k" style="margin:4px 0 12px">ISBN으로 작품을 연결해야 업로드할 수 있습니다. 한 번 연결하면 이후 파일에서는 자동 인식됩니다.</p>
    ${Object.entries(U).map(([i,t])=>`<div class="row" style="margin-bottom:8px"><span style="flex:1 1 200px;min-width:0;overflow-wrap:anywhere">${esc(t)}<br><span class="k">${i}</span></span>
    <select data-sel="${i}"><option value="">작품 선택…</option><option value="__new">+ 새 작품으로 등록</option>${WORKS.map(w=>`<option value="${w.id}">${esc(w.title)}</option>`).join('')}</select>
    <button class="ghost" data-link="${i}" data-title="${esc(t)}">연결</button></div>`).join('')}</div>`:''}
  ${authCard()}
  <div class="card"><div class="row"><span>적용 기간</span>
    <input type="date" id="ps" value="${s.ps||''}"> <span>~</span> <input type="date" id="pe" value="${s.pe||''}"></div>
    <p class="k" style="margin:8px 0 0">이 기간의 ${PN[s.p]} 기존 데이터는 이번 파일로 교체됩니다. ${s.p==='kyobo'?'(월 단위로 교체)':''}</p>
    ${range?'':'<p class="bad" style="margin:8px 0 0">파일의 데이터가 적용 기간을 벗어났습니다.</p>'}
    <p id="ov" class="k" style="margin:8px 0 0"></p>
    <div class="row" style="margin-top:14px"><button id="go" ${ok?'':'disabled'}>업로드 확정</button><span id="msg"></span></div></div>`;
  $('#ps').onchange=e=>{S.ps=e.target.value;render()};$('#pe').onchange=e=>{S.pe=e.target.value;render()};
  $('#go').onclick=commit;if(s.ps&&s.pe&&s.ps<=s.pe)overlap()}

$('#prev').onclick=async e=>{if(e.target.dataset.alink)return linkAuthor(e.target.dataset.alink,e.target);const i=e.target.dataset.link;if(!i)return;
  const sel=$(`[data-sel="${i}"]`).value;if(!sel)return alert('연결할 작품을 선택하세요.');
  let wid=sel;e.target.disabled=true;
  if(sel==='__new'){const{data,error}=await SB.from('works').insert({title:e.target.dataset.title.replace(/^\[[^\]]*\]\s*/,'')}).select('id').single();
    if(error){e.target.disabled=false;return alert(error.message)}wid=data.id}
  const{error}=await SB.from('work_identifiers').insert({work_id:wid,id_type:'isbn',value:i});
  if(error){e.target.disabled=false;return alert(error.message)}
  await loadRefs();render()};

const authCell=(k,name)=>{const w=ISBN[k];if(!w)return `<span class="k">${esc(name)||'-'}</span>`;
  const ids=WA[w]||[];if(!ids.length)return `<span class="bad">${esc(name)||'-'} · 미연결</span>`;
  const ns=ids.map(i=>(AUTHORS.find(a=>a.id===i)||{}).pen_name);
  return esc(ns.join(', '))+(name&&!ns.includes(name)?` <span class="k">(파일: ${esc(name)})</span>`:'')};
function authCard(){const NA={};S.lines.forEach(l=>{const w=ISBN[l.isbn];if(w&&!(WA[w]||[]).length)NA[w]??=l.author});const K=Object.entries(NA);if(!K.length)return '';
  return `<div class="card"><b>작가 미연결 작품 ${K.length}건</b><p class="k" style="margin:4px 0 12px">등록된 작가(필명)만 연결할 수 있습니다. 목록에 없으면 <a href="#/authors">작가 탭</a>에서 먼저 등록하세요. 지금 연결하지 않고 업로드해도 되며, 나중에 연결하면 그대로 반영됩니다.</p>
  ${K.map(([w,name])=>{const m=AUTHORS.find(a=>a.pen_name===name);return `<div class="row" style="margin-bottom:8px"><span style="flex:1 1 200px;min-width:0;overflow-wrap:anywhere">${esc((WORKS.find(x=>x.id===w)||{}).title)}<br><span class="k">파일의 저자명: ${esc(name)||'-'}</span></span>
  <select data-asel="${w}"><option value="">작가 선택…</option>${AUTHORS.map(a=>`<option value="${a.id}" ${m&&m.id===a.id?'selected':''}>${esc(a.pen_name)}</option>`).join('')}</select>
  <button class="ghost" data-alink="${w}" data-name="${esc(name)}">연결</button></div>`}).join('')}</div>`}
async function linkAuthor(w,btn){const sel=$(`[data-asel="${w}"]`).value;if(!sel)return alert('연결할 작가를 선택하세요.');btn.disabled=true;let aid=sel;
  if(sel==='__new'){const{data,error}=await SB.from('authors').insert({pen_name:btn.dataset.name}).select('id').single();if(error){btn.disabled=false;return alert(error.message)}aid=data.id}
  const{error}=await SB.from('work_authors').insert({work_id:w,author_id:aid,share_ratio:1});
  if(error){btn.disabled=false;return alert(error.message)}await loadRefs();render()}
async function overlap(){const{data}=await SB.rpc('preview_upload_overlap',{p_platform:S.p,p_start:S.ps,p_end:S.pe});const o=data?.[0],el=$('#ov');
  if(el)el.innerHTML=o&&o.existing_rows>0?`<span class="bad">주의: 같은 기간의 기존 데이터 ${o.existing_rows}건(${won(o.existing_gross)})이 삭제되고 이 파일로 교체됩니다.</span>`:'같은 기간의 기존 데이터가 없어 새로 추가됩니다.'}

async function commit(){const b=$('#go');b.disabled=true;$('#msg').textContent='업로드 중…';
  const lines=S.lines.map(({isbn:i,title,author,...x})=>({...x,work_id:ISBN[i]}));
  const{error}=await SB.rpc('commit_upload',{p_batch:{platform_code:S.p,filename:S.name,file_sha256:S.sha,period_start:S.ps,period_end:S.pe},p_lines:lines});
  if(error){b.disabled=false;$('#msg').innerHTML=`<span class="bad">${error.code==='23505'?'이미 업로드한 동일한 파일입니다.':esc(error.message)}</span>`;return}
  $('#prev').innerHTML=`<div class="card ok"><b>${PN[S.p]} ${lines.length}행 업로드 완료</b></div>`;S=null;fi.value='';loadFresh()}
</script></body></html>
