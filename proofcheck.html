<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>교정고 점검 · 야화랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;500&display=swap">
<style>
:root{
  --bg:#F3F3F4; --paper:#FFFFFF; --ink:#17171A; --ink2:#46474D; --mute:#6A6B73;
  --line:#D6D7DB; --line2:#E8E8EB; --hl:#EDEDF0;
  --red:#C4251B; --redbg:#FBE9E7; --onink:#FFFFFF; --focus:#2F6FDE;
  --ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --ms:'Noto Serif KR','Batang','AppleMyungjo','Nanum Myeongjo',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121214;--paper:#1A1A1D;--ink:#EDEDEF;--ink2:#BDBEC4;--mute:#8F9098;--line:#34353B;--line2:#26272C;--hl:#2A2B31;--red:#FF7A6E;--redbg:#3A1F1C;--onink:#121214;--focus:#7DA8FF; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#121214;--paper:#1A1A1D;--ink:#EDEDEF;--ink2:#BDBEC4;--mute:#8F9098;--line:#34353B;--line2:#26272C;--hl:#2A2B31;--red:#FF7A6E;--redbg:#3A1F1C;--onink:#121214;--focus:#7DA8FF; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.55 var(--ui);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.ic{display:inline-flex;flex:none;line-height:0}
.ic svg{display:block}

.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ── 상단: 이름 · 검색 · 파일 ── */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:none}
.brand strong{font-weight:600;font-size:15px;white-space:nowrap}
.file{display:flex;gap:8px;align-items:baseline;min-width:0;color:var(--mute);font-size:12.5px}
.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26ch}
.search{position:relative;flex:1 1 320px;max-width:560px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.search input{width:100%;min-height:38px;padding:0 36px 0 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.search input:focus{background:var(--paper)}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}
.actions{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hl)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.btn.primary:hover{background:var(--ink2);border-color:var(--ink2)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px}
 .expwrap{position:relative}
 .expmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:268px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
 .expmenu h3{margin:0 0 6px;font:600 13px/1.4 var(--ui)}
 .expmenu label{display:flex;align-items:flex-start;gap:8px;min-height:32px;padding:4px 0;font-size:13px;cursor:pointer}
 .expmenu label input{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--ink)}
 .expmenu label small{display:block;color:var(--mute);font-size:12px}
 .expmenu .exprow{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.warn{border-color:var(--red);color:var(--red)}
.busy{color:var(--mute);font-size:12.5px}

.mtabs{display:none;background:var(--paper);border-bottom:1px solid var(--line)}
.mtabs button{flex:1;min-height:42px;border:0;background:none;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer}
.mtabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px}
.pane{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.side{background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column}
#sideList{flex:1 0 auto}
@media (max-width:899px){
  .mtabs{display:flex}
  .main{grid-template-columns:1fr}
  .app[data-view=edit] .side,.app[data-view=tools] .editor{display:none}
  .side{border-left:0}
  .search{order:3;flex-basis:100%;max-width:none}
}

/* ── 시작 화면 ── */
.drop{margin:10vh auto 0;max-width:480px;padding:32px 24px;text-align:center}
.drop .ic{color:var(--ink2);margin-bottom:12px}
.drop h1{font:600 19px/1.45 var(--ui);margin:0 0 8px}
.drop p{margin:0 0 18px;color:var(--ink2)}
.drop .note{margin:16px 0 0;color:var(--mute);font-size:12.5px}
.drop.over{outline:2px dashed var(--ink2);outline-offset:-8px;border-radius:12px}

/* ── 원고 ── */
.bar{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.bar .sp{flex:1}
.bar input[type=number]{width:72px;min-height:30px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.legend{display:flex;gap:14px;color:var(--mute)}
.legend i{display:inline-block;width:0;height:12px;vertical-align:-2px;margin-right:6px;border-left:3px solid var(--ink2)}
.legend i.t{border-left-style:dashed}
.legend i.m{border-left-color:var(--line)}
.sheet{max-width:800px;margin:0 auto;padding:12px 8px 96px}
.row{display:grid;grid-template-columns:50px minmax(0,1fr);align-items:start}
.gut{width:100%;padding:9px 10px 0 0;border:0;background:none;color:var(--mute);font:500 11px/1 var(--ui);text-align:right;cursor:pointer;font-variant-numeric:tabular-nums}
.row:hover .gut{color:var(--ink)}
.row.chg .gut{color:var(--red)}
.row.chg .gut::after{content:'';display:inline-block;width:5px;height:5px;margin-left:5px;border-radius:50%;background:var(--red);vertical-align:1px}
.row.chgs .body{box-shadow:inset 0 -1px 0 var(--red)}
.body{padding:2px 10px 2px 12px;border-left:3px solid transparent;font:400 16px/1.95 var(--ms);white-space:pre-wrap;overflow-wrap:anywhere;word-break:keep-all}
.k-D .body,.k-E .body{border-left-color:var(--ink2)}
.k-T .body{border-left:3px dashed var(--ink2)}
.k-P .body,.k-SB .body,.k-S .body{border-left-color:var(--line);color:var(--mute);font:400 13px/1.9 var(--ui)}
.seg{outline:none;border-radius:2px;caret-color:var(--ink)}
.seg:focus{background:var(--hl)}
.seg.it{font-style:italic}
.seg.mk{color:var(--mute);font-family:var(--ui);font-size:13px}
.br{color:var(--mute);font-family:var(--ui);font-size:12px;user-select:none}
button.brb{border:0;background:none;padding:0 3px;margin:0 1px;cursor:pointer;color:var(--red);font-weight:700}
button.brb:hover{outline:1px solid var(--red)}
.row .body{position:relative}
.rb{display:none;position:absolute;right:6px;top:1px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;background:var(--paper,#fff);color:var(--mute);font:500 11px/18px var(--ui);cursor:pointer;z-index:1}
.rb:hover{color:var(--red);border-color:var(--red)}
.row:hover .rb,.row:focus-within .rb{display:block}
@media (hover:none){.rb{display:block;opacity:.7}}
.itemrow{display:flex;gap:6px;align-items:flex-start}.itemrow .item{flex:1;min-width:0}.itemrow .btn{margin-top:4px;white-space:nowrap}
.row.blank .body{position:relative;min-height:22px;padding-top:0;padding-bottom:0;line-height:22px}
.row.blank .body::before{content:'';position:absolute;left:12px;right:10px;top:50%;border-top:1px dashed var(--line);pointer-events:none}
.row.blank .seg{display:inline-block;min-width:4em;min-height:22px;vertical-align:top;position:relative}
.row.blank .gut{padding-top:6px}
.menu{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 8px}
.flash .body{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--hl)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.flash .body{animation:none;background:var(--hl)}}

/* ── 정리 전·후 비교 ── */
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.sw{min-height:30px;padding:0 12px;border:0;background:var(--paper);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--ink2)}
.sw.on{background:var(--ink);color:var(--onink)}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chk input{accent-color:var(--ink)}
.chead{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;padding:2px 0 0 42px;font-weight:600;color:var(--ink)}
.csheet{max-width:1100px;margin:0 auto;padding:8px 8px 96px}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;border-bottom:1px solid var(--line2)}
.cside{display:grid;grid-template-columns:42px minmax(0,1fr);min-width:0}
.cside .gut{cursor:default;padding:8px 8px 0 0}
.cside .body{font:400 14.5px/1.8 var(--ms);padding:3px 8px;border-left:3px solid transparent}
.crow.chg .cside.after .body{border-left-color:var(--red)}
.cside.blank .body{position:relative;min-height:22px}
.cside.blank .body::before{content:'';position:absolute;left:8px;right:8px;top:50%;border-top:1px dashed var(--line)}
.cside.blank.gone .body::before{border-top-color:var(--red)}
.cside.ph .body{display:flex;align-items:center;min-height:24px;color:var(--mute);font:12px var(--ui);background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}
.del{background:var(--redbg);color:var(--red);text-decoration:line-through}
.ins{background:var(--redbg);color:var(--red);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.ctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;font:400 12px/1.4 var(--ui)}
.ctag{padding:0 7px;border:1px solid var(--red);border-radius:10px;color:var(--red);background:none}
button.ctag{cursor:pointer;border-color:var(--line);color:var(--ink2)}
.csep{padding:8px 0 8px 50px;color:var(--mute);font-size:12px;border-bottom:1px solid var(--line2);background:repeating-linear-gradient(90deg,transparent 0 6px,var(--line2) 6px 7px) bottom/100% 1px no-repeat}
@media (max-width:699px){
  .crow{grid-template-columns:1fr}
  .chead{display:none}
  .cside::before{content:attr(data-label);grid-column:1/-1;padding:4px 0 0 42px;font-size:11px;color:var(--mute)}
  .crow:not(.chg) .cside.before{display:none}
  .crow:not(.chg) .cside::before{display:none}
}

/* ── 오른쪽: 기능 ── */
.sec{padding:14px 18px;border-bottom:1px solid var(--line2)}
.sec h2{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font:600 14px/1.4 var(--ui)}
.sec h2 .n{margin-left:auto;color:var(--mute);font-weight:400;font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:12.5px}
.feat{padding:13px 18px;border-bottom:1px solid var(--line2)}
.fh{display:flex;align-items:center;gap:9px}
.fh .ic{color:var(--ink2)}
.fh b{font-weight:600}
.fs{margin-left:auto;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.fs.on{color:var(--ink);font-weight:600}
.fs.err{color:var(--red);font-weight:600}
.fd{margin:4px 0 0 25px;color:var(--ink2);font-size:13px}
details.fl{margin:6px 0 0 25px}
details.fl>summary,details.grp>summary{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer;list-style:none;font-size:12.5px;color:var(--ink2)}
details.fl>summary::-webkit-details-marker,details.grp>summary::-webkit-details-marker{display:none}
details.fl>summary .ic,details.grp>summary .ic{transition:transform .15s}
details[open]>summary .ic.chev{transform:rotate(180deg)}
.tag{flex:none;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;border:1px solid var(--line);color:var(--ink)}
.tag.e{background:var(--redbg);border-color:transparent;color:var(--red)}
.tag.i{color:var(--mute);font-weight:500}
.gname{flex:1;min-width:0}
.gcnt{color:var(--mute);font-variant-numeric:tabular-nums}
details.grp{margin:2px 0 0}
.item{display:block;width:100%;padding:6px 8px;border:0;background:none;text-align:left;cursor:pointer;border-radius:5px;font-size:12.5px}
.item:hover{background:var(--hl)}
.item .ino{display:block;color:var(--mute);font-size:11.5px}
.item .itx{display:block;font-family:var(--ms);font-size:13px;overflow-wrap:anywhere;color:var(--ink)}
.item .itx b{font-weight:600;background:var(--hl);border-bottom:1px solid var(--ink2)}
.item .arr{color:var(--red)}
.more{margin:4px 0 6px}
.mk{margin:8px 0 0 25px}
.mkswitch{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;font-weight:500;cursor:pointer}
.mkswitch input,.mkchk>input{width:16px;height:16px;flex:none;accent-color:var(--ink)}
.mkcnt{margin:2px 0 6px;color:var(--mute);font-size:12.5px}
.mkflt{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.mkflt .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.mkbar{display:flex;gap:6px;margin:2px 0 4px 2px}
.mkchk{display:flex;gap:6px;align-items:flex-start}
.mkchk>input,.mkchk>.mkpad{margin-top:9px;width:16px;flex:none}
.mkchk .item{flex:1;min-width:0}
.mkwarn{color:var(--red)}
.empty{padding:20px 18px;color:var(--mute)}

/* ── 정리 도크(고정) ── */
.dock{position:sticky;bottom:0;margin-top:auto;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--ink)}
.dock .field{display:block;margin:0 0 10px}
.dock .field>span{display:block;margin-bottom:4px;font-size:12.5px;color:var(--ink2)}
.dock input,.dock select{width:100%;min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper)}
.cpick{margin:0 0 10px}
.cpick>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 14px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;user-select:none}
.cpick>summary::-webkit-details-marker{display:none}
.cpick>summary::after{content:'▼';font-size:11px;margin-left:10px}
.cpick[open]>summary::after{content:'▲'}
.cpick>summary:hover{background:var(--hl)}
.cpick>summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.cpick[open]>summary{margin-bottom:2px}
.cpname{font-size:13px;color:var(--ink2);font-weight:600;min-width:0}
.cprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.dock .cprow input.cpcol{width:40px;min-height:34px;padding:0;border:1px solid var(--line);border-radius:0;background:transparent;cursor:pointer;flex:none}
.dock .cprow input.cphex{width:92px;min-height:34px;padding:0 4px;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:transparent;font-size:13px;text-transform:uppercase;flex:none}
.cprecent{display:flex;gap:6px;margin-top:6px;min-height:0}
.cprecent .cpsw{width:22px;height:22px;padding:0;border:1px solid var(--line);cursor:pointer}
.cphint{margin:6px 0 0;font-size:12px;color:var(--mute);line-height:1.5}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:14px;align-items:center;max-width:min(92vw,520px);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--onink);font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.err{background:var(--red);color:#fff}
.toast .tlink{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="app" data-view="edit">
  <header class="top">
    <div class="brand"><span class="ic" data-icon="doccheck" data-size="20"></span><strong>교정고 점검</strong>
      <span class="file" id="fileChip" hidden><span class="fn" id="fileName"></span><span id="fileCount"></span></span></div>
    <div class="search">
      <span class="ic" data-icon="search"></span>
      <input id="q" type="search" placeholder="원고나 기능 검색  ( / )" autocomplete="off" aria-label="원고나 기능 검색">
      <button class="clr" id="qClear" type="button" aria-label="검색어 지우기" hidden><span class="ic" data-icon="x"></span></button>
    </div>
    <div class="actions">
      <span class="busy" id="busy" hidden>처리 중</span>
      <label class="btn" for="fileInput"><span class="ic" data-icon="folder"></span>열기</label>
      <button class="btn" id="btnReset" type="button" disabled title="처음 열었을 때 상태로 되돌립니다(편집·색 변경·정리·선택·검색 모두 초기화)"><span class="ic" data-icon="undo"></span>초기화</button>
      <input id="fileInput" type="file" accept=".hwpx,.docx,.hwp" hidden>
      <div class="expwrap">
        <button class="btn primary" id="btnExport" type="button" disabled aria-haspopup="true"><span class="ic" data-icon="download"></span>내려받기</button>
        <div class="expmenu" id="expMenu" role="dialog" aria-label="내려받을 파일 고르기" hidden>
          <h3>내려받을 파일 고르기</h3>
          <label><input type="checkbox" id="expHwpx"><span>정리본 .hwpx<small id="expHwpxNote"></small></span></label>
          <label><input type="checkbox" id="expDocx"><span>정리본 .docx<small id="expDocxNote"></small></span></label>
          <label style="opacity:.55"><input type="checkbox" id="expHwp" disabled><span>정리본 .hwp<small>준비 중입니다</small></span></label>
          <label><input type="checkbox" id="expCsv"><span>변경 리포트 .csv</span></label>
          <div class="exprow"><button class="btn sm" id="expCancel" type="button">닫기</button><button class="btn sm primary" id="expGo" type="button">내려받기</button></div>
        </div>
      </div>
    </div>
  </header>
  <nav class="mtabs" role="tablist" aria-label="화면">
    <button role="tab" data-view="edit" aria-selected="true">원고</button>
    <button role="tab" data-view="tools" aria-selected="false">기능과 점검</button>
  </nav>
  <main class="main">
    <section class="pane editor" id="paneEditor" aria-label="원고"></section>
    <aside class="pane side" id="paneSide" aria-label="기능과 점검">
      <div id="sideList"></div>
      <div class="dock" id="dock">
        <label class="field"><span>작품명</span><input id="titleIn" type="text" placeholder="파일명에서 읽지 못했습니다. 직접 입력하세요" autocomplete="off"></label>
        <label class="field"><span>문단 사이 빈 줄 (작가 요청 형식)</span>
          <select id="modeSel">
            <option value="mode1">지문 사이 빈 줄 없음</option>
            <option value="mode2">지문 사이 빈 줄 있음</option>

        if (uncolored) issues.push({ sev: '오류', rule: '교정 표기 색 누락', idx: i + 1, el: p, msg: `색이 지정되지 않은 글자에 "/" ${uncolored}개: ${snip}` });
        for (const k of pos) {
          if (open) {                                    // 닫는 슬래시
            const span = nb - open.nb + 1;
            if (open.i === i) {
              const seg = chars.slice(open.k + 1, k);
              const segText = seg.filter((_, q) => !mask[open.k + 1 + q]).map((c) => c.ch).join('');
              const hasComment = seg.some((_, q) => mask[open.k + 1 + q]);
              if (!hasComment && !/\([^()]*\)\s*$/.test(segText.trim())) issues.push({ sev: '경고', rule: '교정 표기 괄호 없음', idx: i + 1, el: p, msg: `/${segText.slice(0, 30)}/` });
            } else {
              for (let j = open.i; j < i; j++) rangeGapAfter.add(paras[j]);
              if (span <= 3) issues.push({ sev: '정보', rule: '여러 문단에 걸친 교정 표기(줄바꿈 그대로 유지)', idx: open.i + 1, el: open.el, msg: `${span}개 문단: ${open.snip}` });
              else issues.push({ sev: '확인필요', rule: `교정 표기가 ${MAX_RANGE}개 문단 안에서 이어짐(닫는 슬래시 확인)`, idx: open.i + 1, el: open.el, msg: `${span}개 문단: ${open.snip}` });
            }
            open = null;
          } else open = { i, k, nb, el: p, snip };       // 여는 슬래시
        }
        if (open && nb - open.nb >= MAX_RANGE) {
          issues.push({ sev: '오류', rule: '닫는 슬래시가 없거나 너무 길게 이어짐', idx: open.i + 1, el: open.el, msg: open.snip });
          open = null;
        }
        const coloredText = chars.filter((c) => c.col).map((c) => c.ch).join('');
        if (!openAtEntry && coloredText.trim() && !coloredText.includes('/') && !coloredText.includes('(@')) redNoSlash++;
      }

      if (balancedUnclosed(full)) issues.push({ sev: '오류', rule: '(@ 코멘트 괄호 미닫힘', idx: i + 1, el: p, msg: snip });
      if (/\(@\s*수정\s*[Xx]\s*\)/.test(full)) issues.push({ sev: '오류', rule: '작가 표기(@수정X) 잔존', idx: i + 1, el: p, msg: snip });
      if (Array.from(stripComments(full).matchAll(/\.+/g)).some((m) => m[0].length === 2 || m[0].length >= 4)) issues.push({ sev: '확인필요', rule: '점 2개/4개 이상 말줄임(자동변경 안 함)', idx: i + 1, el: p, msg: snip });
      if (hasBr(p)) {
        const parts = full.split('\n');
        let hit = null;
        for (let j = 0; j + 1 < parts.length && !hit; j++) {
          const pv = strip(parts[j], EDGE), nx = strip(parts[j + 1], EDGE);
          if (pv === '' || nx === '' || /[.?!\u2026~\u201d\u2019"'\u300d\u300f)]$/.test(pv)) hit = { pv, nx };
        }
        if (hit) issues.push({ sev: '확인필요', rule: '문단 나눔을 Shift+Enter로 함(Enter 문단으로 바꿀지 확인)', idx: i + 1, el: p, br: true, msg: `${hit.pv.slice(-14) || '(줄 시작)'} ↵ ${hit.nx.slice(0, 14) || '(빈 줄)'}` });
        else issues.push({ sev: '확인필요', rule: '강제 줄바꿈 포함(문단 경계로 취급 안 함, 필요하면 문단으로 나누기)', idx: i + 1, el: p, br: true, msg: snip });
      }
    });
    if (open) issues.push({ sev: '오류', rule: '닫는 슬래시가 없거나 너무 길게 이어짐', idx: open.i + 1, el: open.el, msg: open.snip });
    return { issues, redNoSlash, rangeGapAfter };
  }

  // ───────── 빈 줄 / 표기 헬퍼 ─────────
  function makeBlank(doc, template, ref) {
    let n;
    if (template) n = template.cloneNode(true);
    else {
      n = doc.createElementNS(NS_HP, 'hp:p');
      for (const a of Array.from(ref.attributes)) n.setAttribute(a.name, a.value);
      const r0 = kids(ref, 'run')[0];
      const run = doc.createElementNS(NS_HP, 'hp:run');
      run.setAttribute('charPrIDRef', r0 ? r0.getAttribute('charPrIDRef') : '0');
      n.appendChild(run);
    }
    dropLineseg(n);
    return n;
  }
  function insertAfter(parent, node, ref) { parent.insertBefore(node, ref.nextSibling); }

  function addItalicMarker(doc, p, cid, prefix, suffix) {
    dropLineseg(p);
    const runs = kids(p, 'run');
    const mk = (text) => {
      const r = doc.createElementNS(NS_HP, 'hp:run');
      r.setAttribute('charPrIDRef', cid);
      const t = doc.createElementNS(NS_HP, 'hp:t');
      t.appendChild(doc.createTextNode(text));
      r.appendChild(t);
      return r;
    };
    p.insertBefore(mk(prefix), p.firstChild);
    insertAfter(p, mk(suffix), runs[runs.length - 1]);
  }

  function ensureRightParaPr(hdr, baseId) {
    const pp = descendants(hdr, 'paraProperties')[0];
    const list = kids(pp, 'paraPr');
    for (const x of list) { const a = kids(x, 'align')[0]; if (a && a.getAttribute('horizontal') === 'RIGHT') return { id: x.getAttribute('id'), created: false }; }
    const base = list.find((x) => x.getAttribute('id') === baseId) || list[0];
    const nw = base.cloneNode(true);
    nw.setAttribute('id', String(Math.max(...list.map((x) => parseInt(x.getAttribute('id'), 10))) + 1));
    kids(nw, 'align')[0].setAttribute('horizontal', 'RIGHT');
    descendants(nw, 'intent').forEach((el) => el.setAttribute('value', '0'));
    pp.appendChild(nw);
    pp.setAttribute('itemCnt', String(kids(pp, 'paraPr').length));
    return { id: nw.getAttribute('id'), created: true };
  }

  const isBlankP = (p) => strip(ptext(p), EDGE + '\n') === '' && !hasCtrl(p) && !hasBr(p);

  function paraAlign(hdr, id) {
    const pp = descendants(hdr, 'paraProperties')[0];
    const x = pp && kids(pp, 'paraPr').find((e) => e.getAttribute('id') === id);
    const a = x && kids(x, 'align')[0];
    return a ? a.getAttribute('horizontal') : null;
  }

  function applyEndMark(sec, doc, rules, template, getRight, hdr, log, issues) {
    const em = rules.end_mark;
    if (!em.enabled) return;
    const want = em.blank_lines;
    let kidsNow = paragraphs(sec);
    const nonBlank = kidsNow.filter((p) => !isBlankP(p));
    if (!nonBlank.length) return;
    const lastNB = nonBlank[nonBlank.length - 1];
    // 이미 <…> 마침. 이 있으면(마지막 8개 문단 안, 뒤에 (@의견) 문단이 붙어 있어도) 새로 만들지 않는다
    const found = nonBlank.slice(-8).reverse().find((p) => isEndMark(strip(ptext(p), EDGE + '\n')));
    if (found) {
      if (found === lastNB) {
        for (const p of kidsNow.slice(kidsNow.indexOf(found) + 1)) {
          sec.removeChild(p);
          log.push({ rule: '문서 끝 빈 줄 정리', ref: found, idx: '-', before: '(끝의 빈 줄)', after: '제거 후 끝 표기 규칙 적용' });
        }
      }
      const markText = strip(ptext(found), EDGE + '\n');
      kidsNow = paragraphs(sec);
      const pos = kidsNow.indexOf(found);
      let before = 0;
      while (pos - 1 - before >= 0 && isBlankP(kidsNow[pos - 1 - before])) before++;
      for (let k = 0; k < want - before; k++) {
        sec.insertBefore(makeBlank(doc, template, found), found);
        log.push({ rule: '끝 표기 앞 빈 줄 추가', ref: found, idx: '-', before: `빈 줄 ${before}개`, after: `빈 줄 ${want}개` });
      }
      if (paraAlign(hdr, found.getAttribute('paraPrIDRef')) !== 'RIGHT') {
        found.setAttribute('paraPrIDRef', getRight(found.getAttribute('paraPrIDRef')));
        dropLineseg(found);
        log.push({ rule: '끝 표기 오른쪽 정렬', ref: found, idx: '-', before: markText, after: '오른쪽 정렬' });
      }
      const m = stripComments(markText).match(/[<＜〈《‹]\s*([^<>＜＞〈〉《》‹›]+?)\s*[>＞〉》›]/);
      if (em.title && m && m[1].replace(/\s+/g, '') !== em.title.replace(/\s+/g, '')) issues.push({ sev: '정보', rule: '끝 표기의 작품명이 입력한 작품명과 다름(그대로 둠)', idx: '-', el: found, msg: markText });
      return;
    }

    if (!em.title) { issues.push({ sev: '경고', rule: '끝 표기 미추가', idx: '-', msg: '작품명이 지정되지 않음' }); return; }
    const mark = em.format.replace('{title}', em.title);
    // 맨 끝에 (@의견)·# 같은 메모 문단만 남아 있으면, 그 앞(마지막 본문 뒤)에 넣는다
    const isMeta = (p) => /^(\(@|#|@\/)/.test(strip(ptext(p), EDGE + '\n'));
    let last = lastNB;
    for (let i = nonBlank.length - 1; i >= 0; i--) { if (!isMeta(nonBlank[i])) { last = nonBlank[i]; break; } }
    if (last === lastNB) {
      for (const p of kidsNow.slice(kidsNow.indexOf(last) + 1)) {
        sec.removeChild(p);
        log.push({ rule: '문서 끝 빈 줄 정리', ref: last, idx: '-', before: '(끝의 빈 줄)', after: '제거 후 끝 표기 규칙 적용' });
      }
    }
    const lastText = strip(ptext(last), EDGE + '\n');
    let anchor = last;
    for (let k = 0; k < want; k++) { const b = makeBlank(doc, template, last); insertAfter(sec, b, anchor); anchor = b; }
    const rid = getRight(last.getAttribute('paraPrIDRef'));
    const np = doc.createElementNS(NS_HP, 'hp:p');
    np.setAttribute('id', last.getAttribute('id') || '0');
    np.setAttribute('paraPrIDRef', rid);
    np.setAttribute('styleIDRef', last.getAttribute('styleIDRef') || '0');
    np.setAttribute('pageBreak', '0'); np.setAttribute('columnBreak', '0'); np.setAttribute('merged', '0');
    const run = doc.createElementNS(NS_HP, 'hp:run');
    run.setAttribute('charPrIDRef', '0');
    const t = doc.createElementNS(NS_HP, 'hp:t');
    t.appendChild(doc.createTextNode(mark));
    run.appendChild(t); np.appendChild(run);
    insertAfter(sec, np, anchor);
    log.push({ rule: `문서 끝 빈 줄 ${want}개 + 오른쪽 정렬 끝 표기 추가`, ref: np, idx: '-', before: `[마지막 문단] ${strip(ptext(last), EDGE).slice(0, 20)}`, after: mark });
    if (/^(끝|完|fin|FIN)\.?$/.test(lastText)) issues.push({ sev: '정보', rule: "원고 마지막에 이미 '끝.' 문단이 있음(그대로 두고 아래에 끝 표기 추가)", idx: '-', el: last, msg: lastText });
  }

  // ───────── 내보내기 서식: 함초롬바탕 10pt · 들여쓰기 5pt · 줄간격 160% · 문단 아래 7.5pt · 글자 단위 줄나눔 · 양쪽 정렬 ─────────
  const LANG_ATTR = { HANGUL: 'hangul', LATIN: 'latin', HANJA: 'hanja', JAPANESE: 'japanese', OTHER: 'other', SYMBOL: 'symbol', USER: 'user' };
  const setAttr = (el, name, val) => { const v = String(val); if (el.getAttribute(name) === v) return false; el.setAttribute(name, v); return true; };

  /** 언어군마다 함초롬바탕 글꼴을 찾고, 없으면 만든다. 반환: {map: {HANGUL: id, ...}, changed} */
  function ensureFonts(hdr, face) {
    const map = {};
    let changed = false;
    const ff = descendants(hdr, 'fontfaces')[0];
    for (const g of kids(ff, 'fontface')) {
      const list = kids(g, 'font');
      let f = list.find((x) => x.getAttribute('face') === face);
      if (!f) {
        f = list[0].cloneNode(true);
        f.setAttribute('id', String(Math.max(...list.map((x) => parseInt(x.getAttribute('id'), 10))) + 1));
        f.setAttribute('face', face);
        g.appendChild(f);
        g.setAttribute('fontCnt', String(kids(g, 'font').length));
        changed = true;
      }
      map[g.getAttribute('lang')] = f.getAttribute('id');
    }
    return { map, changed };
  }
  const inCase = (el) => { for (let n = el.parentNode; n && n.localName !== 'paraPr'; n = n.parentNode) { if (n.localName === 'case') return true; if (n.localName === 'default') return false; } return false; };

  function normalizeParaPr(pp, f, right) {
    let ch = false;
    const al = kids(pp, 'align')[0];
    if (al) ch = setAttr(al, 'horizontal', right ? 'RIGHT' : f.align) || ch;
    const br = kids(pp, 'breakSetting')[0];
    if (br) ch = setAttr(br, 'breakNonLatinWord', f.break_non_latin) || ch;
    for (const m of descendants(pp, 'margin')) {
      const mult = inCase(m) ? 1 : 2;
      const intent = kids(m, 'intent')[0], next = kids(m, 'next')[0];
      if (intent) ch = setAttr(intent, 'value', (right ? 0 : f.indent) * mult) || ch;
      if (next) ch = setAttr(next, 'value', f.next * mult) || ch;
    }
    for (const ls of descendants(pp, 'lineSpacing')) { ch = setAttr(ls, 'type', 'PERCENT') || ch; ch = setAttr(ls, 'value', f.line_spacing) || ch; }
    return ch;
  }

  /** 본문에 쓰인 글자·문단 서식을 정해진 값으로 맞춘다(색·기울임·굵기 등은 그대로). 바뀐 것이 있으면 true. */
  function normalizeFormat(ctx, rules) {
    const f = rules.body_format;
    if (!f || !f.enabled) return false;
    const hdr = ctx.header, sec = ctx.section;
    let changed = false;
    const fonts = ensureFonts(hdr, f.font);
    changed = fonts.changed;

    const used = new Set(descendants(sec, 'run').map((r) => r.getAttribute('charPrIDRef')));
    for (const c of descendants(hdr, 'charPr')) {
      if (!used.has(c.getAttribute('id'))) continue;
      changed = setAttr(c, 'height', f.height) || changed;
      const fr = kids(c, 'fontRef')[0];
      if (fr) for (const [lang, attr] of Object.entries(LANG_ATTR)) if (fonts.map[lang] != null) changed = setAttr(fr, attr, fonts.map[lang]) || changed;
    }

    const paras = paragraphs(sec);
    const ends = paras.filter((p) => isEndMark(strip(ptext(p), EDGE + '\n')));
    const endSet = new Set(ends);
    const bodyIds = new Set(paras.filter((p) => !endSet.has(p)).map((p) => p.getAttribute('paraPrIDRef')));
    const pp = descendants(hdr, 'paraProperties')[0];
    const byId = (id) => kids(pp, 'paraPr').find((x) => x.getAttribute('id') === id);
    for (const id of bodyIds) { const x = byId(id); if (x) changed = normalizeParaPr(x, f, false) || changed; }
    for (const p of ends) {                                // 끝 표기는 오른쪽 정렬 전용 속성을 쓴다(본문과 공유하면 새로 만든다)
      const id = p.getAttribute('paraPrIDRef');
      let x = byId(id);
      const isRight = x && kids(x, 'align')[0] && kids(x, 'align')[0].getAttribute('horizontal') === 'RIGHT';
      if (!x || !isRight || bodyIds.has(id)) {
        const base = x || kids(pp, 'paraPr')[0], nw = base.cloneNode(true);
        nw.setAttribute('id', String(Math.max(...kids(pp, 'paraPr').map((q) => parseInt(q.getAttribute('id'), 10))) + 1));
        pp.appendChild(nw);
        pp.setAttribute('itemCnt', String(kids(pp, 'paraPr').length));
        p.setAttribute('paraPrIDRef', nw.getAttribute('id'));
        x = nw; changed = true;
      }
      changed = normalizeParaPr(x, f, true) || changed;
    }
    if (changed) { paras.forEach(dropLineseg); ctx.headerModified = true; }      // 줄 배치가 달라지므로 한글이 다시 계산하도록 캐시를 지운다
    return changed;
  }

  // ───────── 본체: 정리 실행 ─────────
  function snippet(it, n = 16) {
    const t = strip(it.text, EDGE + '\n');
    return `[${LABEL[it.kind] || it.kind}] ${t.slice(0, n)}${t.length > n ? '…' : ''}`;
  }

  /** ctx: {section, header, colors, italics}. section/header 를 직접 수정한다. */
  function clean(ctx, rules, mode) {
    const sec = ctx.section, doc = sec.ownerDocument || sec;
    const log = [];
    const items = paragraphs(sec).map((el, i) => ({ el, idx: i + 1 }));
    const chk = runChecks(sec, ctx);
    const issues = chk.issues;
    const prot = protRes(rules);
    const to = rules.ellipsis.to;
    const im = rules.italic_marker || {};

    for (const it of items) {
      const p = it.el;
      const beforeText = ptext(p);
      const trimmed = strip(beforeText, EDGE + '\n');
      if (isEndMark(trimmed)) { it.kind = 'P'; it.text = beforeText; continue; }
      if (SB_RE.test(trimmed)) { it.kind = 'SB'; it.text = beforeText; continue; }
      if (prot.some((r) => r.test(trimmed))) { it.kind = /^[\*\uff0a\s\u00a0]+$/.test(trimmed) ? 'SB' : 'P'; it.text = beforeText; continue; }

      let touched = false;
      if (rules.trim_paragraph_edges) {
        const [lead, trail] = trimEdges(p);
        if (lead || trail) {
          touched = true;
          const side = (lead ? '앞' : '') + (lead && trail ? '·' : '') + (trail ? '뒤' : '');
          const wasBlank = strip(ptext(p), EDGE + '\n') === '';
          const desc = wasBlank ? '공백만 있는 문단 → 빈 줄' : `문단 ${side} 공백 제거`;
          const bs = (lead ? JSON.stringify(lead) : '') + (lead && trail ? '…' : '') + (trail ? JSON.stringify(trail) : '');
          log.push({ rule: desc, ref: p, idx: it.idx, before: `${trimmed.slice(0, 24)} ${bs}`, after: trimmed.slice(0, 24) });
        }
      }
      if (rules.ellipsis.normalize) {
        for (const [b, a] of normalizeEllipsis(p, to)) { touched = true; log.push({ rule: '말줄임표 … 통일', ref: p, idx: it.idx, before: b, after: a }); }
      }
      if (touched) dropLineseg(p);

      let text = ptext(p);
      const core = strip(text, EDGE + '\n');
      if (core === '') it.kind = (hasCtrl(p) || hasBr(p)) ? 'S' : 'BLANK';
      else if (hasCtrl(p) || hasBr(p)) it.kind = 'S';
      else {
        const c = classify(text, rules);
        it.kind = c.kind;
        if (c.straight) {
          if (AUTO_ROUND_QUOTES && roundQuotes(p, classifyCore(text)[0])) { dropLineseg(p); text = ptext(p); log.push({ rule: '직선 따옴표 → 둥근 따옴표', ref: p, idx: it.idx, before: core.slice(0, 24), after: strip(text, EDGE + '\n').slice(0, 24) }); }
          else issues.push({ sev: '확인필요', rule: '직선 따옴표 발화(자동 변경 안 함, 직접 확인)', idx: it.idx, el: p, msg: core.slice(0, 40) });
        }
        if (c.why === 'dash') issues.push({ sev: '정보', rule: "'-'로 시작하는 대사로 분류", idx: it.idx, el: p, msg: core.slice(0, 40) });
        else if (c.why === 'sfx') issues.push({ sev: '정보', rule: '의성어 단독 문단으로 분류', idx: it.idx, el: p, msg: core.slice(0, 40) });
        if (c.mixed) issues.push({ sev: '확인필요', rule: '따옴표로 시작하지만 문단 전체가 발화가 아님(지문 처리)', idx: it.idx, el: p, msg: core.slice(0, 40) });
        for (const q of periodIssues(text, c.kind)) issues.push({ sev: '확인필요', rule: q.rule, idx: it.idx, el: p, msg: q.msg });

        if (im.enabled && ['D', 'T', 'E'].includes(c.kind)) {
          const txt = iterSlots(p).filter((x) => x.k === 'slot' && sget(x).trim());
          const allItalic = txt.length > 0 && txt.every((x) => ctx.italics.has(x.cid));
          const marked = core.startsWith(im.prefix) && core.endsWith(im.suffix);
          if (allItalic && !marked) {
            if (c.kind === 'E') issues.push({ sev: '정보', rule: '기울임 의성어(표기 추가 대상 아님: 대사·속마음만)', idx: it.idx, el: p, msg: core.slice(0, 40) });
            else {
              const pick = txt.find((x) => isBlackish(ctx.colors[x.cid])) || txt[0];
              addItalicMarker(doc, p, pick.cid, im.prefix, im.suffix);
              log.push({ rule: '기울임 표기 추가', ref: p, idx: it.idx, before: core.slice(0, 40), after: im.prefix + (core.length <= 40 ? core : core.slice(0, 37) + '…') + im.suffix });
              text = ptext(p);
            }
          }
        }
      }
      it.text = text;
    }

    const CONTENT = ['N', 'D', 'T', 'E'];
    const group = (k) => (k === 'N' ? 'N' : 'V');
    const mode_ = mode || rules.paragraph_spacing;
    const want = (a, b) => (mode_ === 'mode1' ? 0 : mode_ === 'mode2' ? 1 : (group(a) === group(b) ? 0 : 1));
    const firstBlank = items.find((i) => i.kind === 'BLANK');
    const template = firstBlank ? firstBlank.el.cloneNode(true) : null;
    const nb = items.map((it, k) => (it.kind !== 'BLANK' ? k : -1)).filter((k) => k >= 0);
    let keptBoundary = 0, keptMulti = 0, keptRange = 0;
    for (let q = 0; q + 1 < nb.length; q++) {
      const a = nb[q], b = nb[q + 1];
      const gap = items.slice(a + 1, b), A = items[a], B = items[b];
      const sbPair = (A.kind === 'SB' && CONTENT.includes(B.kind)) || (CONTENT.includes(A.kind) && B.kind === 'SB');
      if ((CONTENT.includes(A.kind) && CONTENT.includes(B.kind)) || sbPair) {
        const w = sbPair ? 1 : want(A.kind, B.kind), h = gap.length;     // 장면 구분은 위·아래 빈 줄 1칸씩
        const ctxs = `${snippet(A)} ↓ ${snippet(B)}`;
        if (chk.rangeGapAfter.has(A.el)) keptRange++;      // 교정 표기 범위가 여러 문단에 걸친 곳은 원문 줄바꿈 그대로
        else if (h >= 2 && !sbPair) keptMulti++;          // 빈 줄이 2개 이상 이어진 곳은 그대로 둔다(장면 구분 위·아래는 1칸으로 줄임)
        else if (h > w) {
          gap.slice(w).forEach((g) => { sec.removeChild(g.el); log.push({ rule: sbPair ? '장면 구분 위·아래 빈 줄 삭제' : '빈 줄 삭제', ref: A.el, idx: g.idx, before: ctxs, after: w === 0 ? '빈 줄 없음' : '빈 줄 1개로' }); });
        } else if (h < w) {
          let anchor = A.el;
          for (let k = 0; k < w - h; k++) { const nw = makeBlank(doc, template, A.el); insertAfter(sec, nw, anchor); anchor = nw; log.push({ rule: sbPair ? '장면 구분 위·아래 빈 줄 추가' : '빈 줄 추가', ref: A.el, idx: A.idx, before: ctxs, after: '빈 줄 1개' }); }

        gap.forEach((g) => { sec.removeChild(g.el); log.push({ rule: '장면 구분(*)끼리 사이 빈 줄 삭제', ref: A.el, idx: g.idx, before: '* ↓ *', after: '붙임' }); });
      } else if (gap.length) keptBoundary++;
    }

    const state = { headerModified: false };
    const getRight = (baseId) => { const r = ensureRightParaPr(ctx.header, baseId); state.headerModified = state.headerModified || r.created; return r.id; };
    applyEndMark(sec, doc, rules, template, getRight, ctx.header, log, issues);
    pruneEmptyText(sec);
    if (state.headerModified) ctx.headerModified = true;
    if (keptRange) issues.push({ sev: '정보', rule: '여러 문단에 걸친 교정 표기 안의 줄바꿈은 그대로 유지', idx: '-', msg: `${keptRange}곳` });
    if (keptMulti) issues.push({ sev: '정보', rule: '빈 줄 2개 이상 연속은 그대로 유지', idx: '-', msg: `${keptMulti}곳` });
    if (keptBoundary) issues.push({ sev: '정보', rule: '보호 문단(*, #, (@ 등) 인접 빈 줄은 그대로 유지', idx: '-', msg: `${keptBoundary}곳` });
    if (chk.redNoSlash) issues.push({ sev: '정보', rule: '슬래시 없이 색만 칠한 교정(오탈자 처리로 간주)', idx: '-', msg: `${chk.redNoSlash}곳` });
    const summary = {};
    log.forEach((l) => { summary[l.rule] = (summary[l.rule] || 0) + 1; });
    return { log, issues, summary };
  }

  /** 편집 없이 정리 결과 건수만 미리 계산(복제본에서 실행). */
  function preview(ctx, rules, mode) {

    return r.summary;
  }

  // ───────── 에디터: 빈 문단에 글자 입력 / 엔터로 문단 나누기 ─────────

  }

  /** p 안의 n번째(0부터) 강제 줄바꿈에서 문단을 둘로 나눈다(줄바꿈 자체는 사라짐). 반환 {node} = 뒤쪽 새 문단 / null */

    const k = brs[n];

    if (!hasT(slots.slice(0, k)) || !hasT(slots.slice(k + 1))) {     // 줄바꿈 앞(또는 뒤)에 글이 없으면: 줄바꿈만 지운다(빈 문단을 만들지 않음)

  // ───────── 정리 전·후 비교 ─────────

  /** 정리 전(snap)과 지금(sec)의 문단을 같은 줄에 맞춰 나열. 지워진 문단은 after=null, 새 문단은 before=null. */

  /** 문단(또는 스냅샷)의 글자 조각 → [{ch, cid}] (강제 줄바꿈은 '\n') */

  const segsOfPara = (p) => iterSlots(p).map((x) => (x.k === 'slot' ? { t: sget(x), cid: x.cid } : (x.kind === 'br' ? { br: true } : null))).filter(Boolean);

  // ───────── 교정 기호 반영(작교본) ─────────
  // /A(B)/ 교체 · /A(추가)/ · /A(이동)/ · /A(삭제)/ 와 작가 표기 (@수정X)를 반영한다. (@…) 코멘트는 건드리지 않고, 고른 것만 지운다.
  // 글자만 지우고 남는 글자는 원래 자리(run)에 그대로 두므로 색·서식은 유지된다. 확신이 없는 것은 '확인필요'로 빼고 기본적으로 바꾸지 않는다.
  const MK_BRK = '\u0001';
  // 부호 바로 뒤에 글자가 붙어 있을 때, 조사·어미로 보이면 붙여 두고 새 단어면 한 칸 띄운다(애매하면 띄우지 않는다)
  const JOSA1 = '이가을를은는의에로와과도만들께랑나라인임며고서다요죠네군면니게던든';
  const JOSA_W = /^(처럼|만큼|보다|부터|까지|마다|조차|밖에|뿐|씩|쯤|께서|에서|에게|한테|으로|이라|입니다|이다|이었|였|지만|지요|네요)/;
  const COLOR_NAMES = { '#FF0000': '빨강', '#008000': '초록', '#00FF00': '연두', '#0000FF': '파랑', '#FFFF00': '노랑', '#FFA500': '주황', '#800080': '보라', '#FF00FF': '자홍', '#00FFFF': '하늘', '#808080': '회색', '#FFFFFF': '흰색', '#FFC0CB': '분홍', '#A52A2A': '갈색' };
  const colorName = (hex) => { const c = String(hex || '').toUpperCase(); return COLOR_NAMES[c] || (isBlackish(c) ? '검정' : c); };
  const isRejText = (t) => /^\(@\s*수정\s*[xX×✕]\s*\)$/.test(t);

      else out.push({ ch: x.kind === 'br' ? '\n' : MK_BRK, slot: null });

    let d = 0;

      if (inner[j] === ')') d++;
      else if (inner[j] === '(') { d--; if (d === 0) return [inner.slice(0, j), inner.slice(j + 1, -1)]; }
    }

  function scanPara(p, pi, colors) {

    const show = (t) => t.replace(/\u0001/g, '');

      let lo = Math.max(0, a - 10), hi = Math.min(s.length, b + 11);
      for (const [ca, cb] of sp) { if (ca < lo && lo < cb) lo = ca; if (ca < hi && hi < cb) hi = cb; }

      for (let i = lo; i < hi; i++) { bf += s[i]; if (!del.has(i)) af += (subs && subs[i]) || s[i]; }

    });

    for (let i = s.indexOf('(@'); i >= 0; i = s.indexOf('(@', i + 1)) if (!inC(i)) { noop('확인필요', '닫히지 않은 (@ 코멘트 — 이 문단은 건드리지 않음', i, i + 2); return res; }

        if (inner.trim() !== '' && !/[가-힣A-Za-z0-9]/.test(a > 0 ? s[a - 1] : ' ')) { const raw = new Set([a, b]), [b4, af] = win(a, b, raw); add({ kind: '범위 표시', reason: '', color, raw, removal: null, before: b4, after: af, auto: true, note: '' }); }

        let curRun = null, curT = null, curId = -1;

      const f = ctx.zip.file(name);
      if (!f) continue;
      if (rules.strip_doc_history && name.startsWith('DocHistory/')) continue;

  }

    finally { busy(false); }
  }
  async function mount(buf, name) {
    const ctx = await E.load(buf, { JSZip: window.JSZip, DOMParser: window.DOMParser, XMLSerializer: window.XMLSerializer, CFB: window.CFB });
    state.buf = buf; state.name = name; state.ctx = ctx;
    state.title = E.parseFilename(name).title;
    state.cleaned = false; state.dirty = false; state.log = []; state.page = 0; state.menuFor = null;
    state.snap = E.snapshot(ctx.section); state.edMode = 'edit'; state.cmp = null; state.cmpPage = 0; state.cmpOnly = true; state.undoStack = []; state.lastOp = null;
    state.chgText = new Set(); state.chgSpace = new Set(); state.preview = null; state.shown = {}; state.seen = new Set();
    state.mk = newMk(name); state.cl = newCl(); state.exp = { hwpx: ctx.format !== 'docx', docx: ctx.format === 'docx', csv: false }; state.focusEl = null; state.cp.sel = null;
    state.q = ''; state.hitPos = -1; state.hits = []; { const q = $('#q'), qc = $('#qClear'); if (q) q.value = ''; if (qc) qc.hidden = true; }
    recompute(); analyze();
    $('#btnExport').disabled = false; $('#btnReset').disabled = false;
    $('#fileChip').hidden = false; $('#fileName').textContent = name; $('#fileCount').textContent = `문단 ${nf(state.rows.length)}`;
    $('#titleIn').value = state.title;
    renderAll(); schedulePreview(); cpHint();
    if (ctx.notes && ctx.notes.length) toast(ctx.notes.join(' '));
    // 열면 항상 1쪽 맨 위부터 보이게(이전 파일의 스크롤 위치가 남지 않도록)
    ['#paneEditor', '#paneSide', '#sideList'].forEach((s) => { const el = $(s); if (el) el.scrollTop = 0; });
    try { window.scrollTo(0, 0); } catch (e) { /* 지원하지 않는 환경 */ }
    if (mq('(max-width:899px)')) setView('edit');
  }

  // ───────── 분석 ─────────
  function recompute() {
    const rules = currentRules(), prot = E.protRes(rules), mt = E.markTextOf(rules);
    state.rows = E.paragraphs(state.ctx.section);
    state.kinds = new Map(); state.rowIdx = new Map();
    state.rows.forEach((p, i) => { state.kinds.set(p, E.kindOf(p, rules, prot, mt)); state.rowIdx.set(p, i); });
  }
  function analyze() {
    const r = E.runChecks(state.ctx.section, state.ctx);
    const issues = r.issues.slice();
    state.rows.forEach((p) => {
      const k = state.kinds.get(p);
      if (!k || !k.c) return;
      const core = E.strip(E.ptext(p), E.EDGE + '\n').slice(0, 40);
      if (k.c.straight) issues.push({ sev: '확인필요', rule: E.AUTO_ROUND_QUOTES ? '직선 따옴표 발화(정리하면 둥근 따옴표로 바뀜)' : '직선 따옴표 발화(자동 변경 안 함, 직접 확인)', el: p, msg: core });
      if (k.c.mixed) issues.push({ sev: '확인필요', rule: '따옴표로 시작하지만 문단 전체가 발화가 아님(지문 처리)', el: p, msg: core });
      for (const q of E.periodIssues(E.ptext(p), k.kind)) issues.push({ sev: '확인필요', rule: q.rule, el: p, msg: q.msg });
    });
    if (r.redNoSlash) issues.push({ sev: '정보', rule: '슬래시 없이 색만 칠한 교정(오탈자 처리로 간주)', el: null, msg: `${r.redNoSlash}곳` });
    state.issues = issues;
    refreshMarks(); refreshColors();
  }
  const schedulePreview = debounce(() => {
    if (!state.ctx || state.cleaned) return;
    state.previewBusy = true; renderSide();
    setTimeout(() => {
      try { state.preview = E.preview(state.ctx, currentRules()); } catch (e) { state.preview = null; }
      state.previewBusy = false; renderSide();
    }, 20);
  }, 350);

  // ───────── 정리 / 되돌리기 ─────────
  function runClean() {
    if (!state.ctx) return;
    const rules = currentRules();
    busy(true);
    setTimeout(() => {
      try {
        let mkLog = [];
        if (state.mk.apply) { const sel = mkSelection(); if (sel && (sel.ids.size || sel.comments.size)) mkLog = E.applyMarks(state.ctx, sel).log; }   // 교정 기호는 다른 정리보다 먼저 반영
        let clLog = [];
        if (state.cl.sel.size) { const ids = clSelection(); if (ids && ids.size) clLog = E.applyUncolor(state.ctx, ids).log; }   // 체크한 색 글자만 검정으로
        const r = E.clean(state.ctx, rules);
        r.log = mkLog.concat(clLog, r.log);
        state.log = r.log; state.cleaned = true; state.dirty = true; state.menuFor = null;
        state.chgText = new Set(r.log.filter((l) => FEATURES.slice(1, 6).some((f) => f.match(l.rule)) || l.rule === '교정 기호 반영' || l.rule === '편집자 코멘트 삭제' || l.rule === '색 검정으로 되돌리기').map((l) => l.ref));
        state.chgSpace = new Set(r.log.filter((l) => FEATURES[0].match(l.rule)).map((l) => l.ref));
        state.undoStack = []; state.lastOp = null;
        recompute(); analyze();
        $('#fileCount').textContent = `문단 ${nf(state.rows.length)}`;
        state.shown = {};
        state.cmpOnly = true; state.cmpPage = 0; buildCmp(); state.edMode = 'compare';       // 정리가 끝나면 원본과 나란히 보여 줌
        { const kf = cmpIndexOfFocus(); if (kf != null) state.cmpPage = Math.floor(kf / CMP_PAGE); renderAll(); if (kf != null) scrollCmpRow(kf); }   // 다시 정리해도 편집하던 문장 위치로
        if (r.issues.some((i) => i.rule === '끝 표기 미추가')) toast('작품명이 비어 있어 끝 표기는 넣지 않았습니다.', 'err');
      } catch (e) { toast('정리 중 오류가 났습니다: ' + (e && e.message), 'err'); }
      busy(false);
    }, 20);
  }
  function revertOriginal(msg) {
    if (!state.buf) return;
    busy(true);
    mount(state.buf, state.name).then(() => toast(msg || '원본을 다시 불러왔습니다. 편집한 내용은 사라졌습니다.')).catch((e) => toast(e.message, 'err')).finally(() => busy(false));
  }

  // ───────── 저장 ─────────
  let dlCache;
  async function getDownloads() {
    if (dlCache !== undefined) return dlCache;
    try { dlCache = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; } catch (e) { dlCache = null; }
    return dlCache;
  }
  async function saveFile(filename, data, mime) {
    const dl = await getDownloads();
    if (dl) {
      const name = /\.hwpx$/i.test(filename) ? filename + '.zip' : filename;      // 이 화면에서는 .hwpx 저장이 허용되지 않음
      try {
        await dl.save({ filename: name, data });
        toast(name !== filename ? '저장했습니다. 파일 이름 끝의 “.zip”만 지우면 한글에서 열립니다.' : '저장했습니다.');
      } catch (e) {
        if (e && e.code === 'declined') toast('저장을 취소했습니다.');
        else toast('저장하지 못했습니다' + (e && e.message ? `: ${e.message}` : '.'), 'err');
      }
      return;
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([data], { type: mime })), download: filename });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('저장했습니다.');
  }

  const hwpxBase = () => Uint8Array.from(atob(HWPX_BASE_B64), (c) => c.charCodeAt(0));
  const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const baseName = () => state.name.replace(/\.(hwpx|docx|hwp)$/i, '');
  async function exportMain(kind) {            // kind: 'hwpx' | 'docx'  — 정리본을 고른 형식으로 저장
    if (!state.ctx) return;
    busy(true);
    try {
      const deps = { JSZip: window.JSZip, DOMParser: window.DOMParser, XMLSerializer: window.XMLSerializer };
      state.ctx.saveNotes = [];
      const fromDocx = state.ctx.format !== 'hwpx';
      const bytes = kind === 'docx' ? await E.saveDocx(state.ctx, currentRules(), deps)
        : fromDocx ? await E.saveHwpxFromDocx(state.ctx, currentRules(), hwpxBase(), Object.assign({ title: baseName() }, deps)) : await E.save(state.ctx, currentRules(), deps);
      renderEditor();
      await saveFile(baseName() + '_정리본.' + kind, bytes, kind === 'docx' ? DOCX_MIME : 'application/hwp+zip');
      state.dirty = false;
      if (state.ctx.saveNotes && state.ctx.saveNotes.length) toast(state.ctx.saveNotes.join(' '), 'err');
      else if (!state.cleaned) toast('정리하지 않은 상태로 저장했습니다.');
    } catch (e) { toast('저장 파일을 만들지 못했습니다: ' + (e && e.message), 'err'); }
    busy(false);
  }
  // 내려받기: 받을 파일을 고른다(정리본 hwpx·docx, 변경 리포트 csv)
  function expOpen(on) {
    const m = $('#expMenu'); if (!m) return;
    const open = on === undefined ? m.hidden : on;
    if (open && state.ctx) {
      const fmt = state.ctx.format || 'hwpx';
      $('#expHwpx').checked = !!state.exp.hwpx; $('#expDocx').checked = !!state.exp.docx;
      $('#expHwpxNote').textContent = fmt !== 'hwpx' ? '한글 양식 기반으로 새로 만듭니다. 서식이 일부 달라질 수 있습니다' : '';
      $('#expDocxNote').textContent = fmt !== 'docx' ? '서식이 일부 달라질 수 있습니다' : '';
      $('#expCsv').checked = state.exp.csv;
    }
    m.hidden = !open;
  }
  async function expGo() {
    const want = { hwpx: $('#expHwpx').checked, docx: $('#expDocx').checked, csv: $('#expCsv').checked };
    if (!want.hwpx && !want.docx && !want.csv) { toast('내려받을 파일을 하나 이상 골라 주세요.', 'err'); return; }
    state.exp = want; expOpen(false);
    if (want.hwpx) await exportMain('hwpx');
    if (want.docx) await exportMain('docx');
    if (want.csv) await exportCsv();
  }
  async function exportCsv() {
    await saveFile(baseName() + '_변경리포트.csv', E.reportCsv(state.log, state.issues.map((i) => ({ sev: i.sev, rule: i.rule, idx: i.el && state.rowIdx.has(i.el) ? (state.rowIdx.get(i.el) + 1) : '-', msg: i.msg }))), 'text/csv');
  }

  // ───────── 화면 전환 ─────────
  function setView(v) {
    state.view = v;
    $('#app').dataset.view = v;
    document.querySelectorAll('.mtabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  }
  function renderAll() { renderEditor(); renderSide(); updateDock(); setView(state.view); }

  // ───────── 원고 편집기 ─────────
  const segMap = new WeakMap();
  const KIND_LABEL = { N: '지문', D: '대사', T: '속마음', E: '의성어', P: '메모·표기', SB: '장면 구분', S: '특수 문단', BLANK: '빈 줄' };
  const supportsPlain = (() => { try { const d = document.createElement('div'); d.contentEditable = 'plaintext-only'; return d.contentEditable === 'plaintext-only'; } catch (e) { return false; } })();

  function renderRow(p, i) {
    const k = state.kinds.get(p) || { kind: 'N' };
    const cls = ['row'];
    if (k.kind === 'BLANK') cls.push('blank'); else cls.push('k-' + k.kind);
    if (state.chgText.has(p)) cls.push('chg');
    if (state.chgSpace.has(p)) cls.push('chgs');
    const gut = h('button', { class: 'gut', type: 'button', 'aria-label': `${i + 1}번째 문단(${KIND_LABEL[k.kind] || ''}) 메뉴`, onclick: () => toggleMenu(p) }, String(i + 1));
    const body = h('div', { class: 'body' });
    if (k.kind === 'BLANK') body.append(h('span', { class: 'seg', 'data-blank': '1', contenteditable: supportsPlain ? 'plaintext-only' : 'true', spellcheck: 'false', 'aria-label': '빈 줄(글자를 입력할 수 있습니다)' }));
    else {
      let any = false, brN = 0;
      E.iterSlots(p).forEach((s) => {
        if (s.k === 'barrier') { if (s.kind === 'br') { const bn = brN++; body.append(h('button', { class: 'br brb', type: 'button', title: '강제 줄바꿈(Shift+Enter) — 눌러서 여기서 문단 나누기', 'aria-label': '강제 줄바꿈에서 문단 나누기', onclick: () => breakToParas(p, bn) }, '↵')); } return; }
        const v = E.sget(s);
        if (v === '') return;
        any = true;
        const col = state.ctx.colors[s.cid];
        const sp = h('span', { class: 'seg' + (state.ctx.italics.has(s.cid) ? ' it' : '') + ((v === '@' || v === '@(기울임)') ? ' mk' : ''), contenteditable: supportsPlain ? 'plaintext-only' : 'true', spellcheck: 'false' }, v);
        if (!E.isBlackish(col)) sp.style.color = col;            // 교정 표시 색은 어떤 색이든 파일에 지정된 그대로
        segMap.set(sp, s);
        body.append(sp);
      });
      if (!any) body.append(h('span', { class: 'br', text: '(내용 없음)' }));
    }
    if (k.kind === 'BLANK') body.append(h('button', { class: 'rb', type: 'button', title: '이 빈 줄 지우기', 'aria-label': '이 빈 줄 지우기', onclick: () => structural('delete', p) }, '× 지우기'));
    else body.append(h('button', { class: 'rb', type: 'button', title: '아래에 빈 줄 넣기', 'aria-label': '아래에 빈 줄 넣기', onclick: () => structural('after', p) }, '+ 빈 줄'));
    return h('div', { class: cls.join(' '), 'data-i': String(i) }, gut, body);
  }
  function renderEditor() {
    const pane = $('#paneEditor');
    if (state.ctx && state.cleaned && state.edMode === 'compare' && state.cmp) { renderCompare(); return; }
    if (!state.ctx) {
      pane.replaceChildren(h('div', { class: 'drop', id: 'drop' },
        icon('doccheck', 30),
        h('h1', { text: '교정고를 열어 발송 전 점검을 시작하세요' }),
        h('p', { text: 'hwpx·docx·hwp 파일을 이 화면에 놓거나 선택합니다. 열면 바뀔 내용을 바로 미리 보여 줍니다.' }),
        h('label', { class: 'btn primary', for: 'fileInput' }, icon('folder'), '파일 열기'),
        h('p', { class: 'note', text: '파일은 이 브라우저 안에서만 처리되며 어디로도 전송되지 않습니다.' })));
      return;

    else if (f.id === 'quotes' && !E.AUTO_ROUND_QUOTES) {
      if (state.ctx) { const n = state.issues.filter((i) => i.rule.includes('직선 따옴표')).length; status = n ? `확인 ${nf(n)}곳` : '해당 없음'; if (n) cls += ' on'; }
    } else if (f.id === 'issues') {
      if (!state.ctx) status = '';
      else {
        const e = state.issues.filter((i) => i.sev === '오류').length, w = state.issues.filter((i) => i.sev === '확인필요' || i.sev === '경고').length;
        status = e ? `오류 ${nf(e)}` + (w ? `  확인 ${nf(w)}` : '') : (w ? `확인 ${nf(w)}` : '문제 없음');
        if (e) cls += ' err'; else if (w) cls += ' on';
        if (state.issues.length) body = issueGroups();
      }
    } else {
      const c = state.cleaned ? state.log.filter((l) => f.match(l.rule)).length : Object.entries(state.preview || {}).filter(([k]) => f.match(k)).reduce((s, [, v]) => s + v, 0);
      if (state.ctx) {
        if (state.cleaned) { status = c ? `${nf(c)}곳 변경` : '변경 없음'; if (c) body = itemsDetails('feat|' + f.id, `바뀐 곳 ${nf(c)}곳 보기`, state.log.filter((l) => f.match(l.rule)), logItem); }
        else if (state.previewBusy || !state.preview) status = '계산 중';
        else status = c ? `${nf(c)}곳 예정` : '해당 없음';
        if (c) cls += ' on';
      }
    }
    return h('div', { class: 'feat' }, h('div', { class: 'fh' }, icon(f.icon), h('b', { text: f.name }), h('span', { class: cls, text: status })), h('p', { class: 'fd', text: f.desc }), body);
  }
  function renderSide() {
    const box = $('#sideList'), q = state.q.toLowerCase(), parts = [];
    if (q) {
      state.hits = searchHits();
      if (!state.ctx) parts.push(h('div', { class: 'sec' }, h('p', { class: 'muted', text: '파일을 열면 원고 안에서도 검색할 수 있습니다.' })));
      else {
        const shown = state.shown.hits || 30;
        const sec = h('div', { class: 'sec' }, h('h2', {}, '원고에서 찾기', h('span', { class: 'n', text: state.hits.length >= 400 ? '400개 이상' : `${nf(state.hits.length)}개` })));
        if (!state.hits.length) sec.append(h('p', { class: 'muted', text: '원고에 일치하는 글이 없습니다.' }));
        state.hits.slice(0, shown).forEach((hit) => { const [a, m, z] = hitText(hit); sec.append(h('button', { class: 'item', type: 'button', onclick: () => jumpTo(hit.el) }, h('span', { class: 'ino', text: `문단 ${nf(numOf(hit.el))}` }), h('span', { class: 'itx' }, a, h('b', { text: m }), z))); });
        if (state.hits.length > shown) sec.append(moreBtn('hits', shown, state.hits.length));
        parts.push(sec);
      }
    }
    const feats = q ? FEATURES.filter((f) => (f.name + ' ' + f.desc + ' ' + f.keys).toLowerCase().includes(q)) : FEATURES;
    feats.forEach((f) => { const el = featEl(f); if (el) parts.push(el); });
    if (q && !feats.length && (!state.ctx || !state.hits.length)) parts.push(h('div', { class: 'empty', text: '일치하는 기능이나 원고가 없습니다.' }));
    box.replaceChildren(...parts);
  }
  function updateDock() {
    $('#btnClean').disabled = !state.ctx;
    $('#btnClean').textContent = state.cleaned ? '이 형식으로 다시 정리하기' : '정리하기';
    $('#afterRow').hidden = !(state.ctx && state.cleaned);
    $('#modeSel').value = state.mode;
  }

  // ───────── 연결 ─────────
  $('#fileInput').addEventListener('change', (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; openFile(f); });
  $('#btnExport').addEventListener('click', (e) => { e.stopPropagation(); expOpen(); });
  $('#expGo').addEventListener('click', expGo);
  $('#expCancel').addEventListener('click', () => expOpen(false));
  document.addEventListener('click', (e) => { const m = $('#expMenu'); if (m && !m.hidden && !m.contains(e.target)) expOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') expOpen(false); });
  $('#btnClean').addEventListener('click', runClean);
  initColorPicker();
  $('#btnCsv').addEventListener('click', exportCsv);
  const rs = $('#btnReset'); let rsArmed = false;     // 초기화: 처음 열었을 때 상태로(고친 내용이 있으면 한 번 더 확인)
  rs.addEventListener('click', () => {
    if (!state.ctx) return;
    const label = rs.lastChild;
    if ((state.dirty || state.cleaned) && !rsArmed) { rsArmed = true; label.textContent = '고친 내용이 사라집니다. 한 번 더'; rs.classList.add('warn'); setTimeout(() => { rsArmed = false; label.textContent = '초기화'; rs.classList.remove('warn'); }, 4000); return; }
    rsArmed = false; label.textContent = '초기화'; rs.classList.remove('warn');
    revertOriginal('처음 열었을 때 상태로 초기화했습니다.');
  });
  const rv = $('#btnRevert'); let armed = false;
  rv.addEventListener('click', () => {
    const label = rv.lastChild;
    if (!armed) { armed = true; label.textContent = '편집한 내용이 사라집니다. 한 번 더 누르세요'; rv.classList.add('warn'); setTimeout(() => { armed = false; label.textContent = '원본으로 되돌리기'; rv.classList.remove('warn'); }, 4000); }
    else { armed = false; label.textContent = '원본으로 되돌리기'; rv.classList.remove('warn'); revertOriginal(); }
  });
  $('#titleIn').addEventListener('input', (e) => { state.title = e.target.value; if (state.ctx && !state.cleaned) { recompute(); schedulePreview(); } });
  $('#modeSel').addEventListener('change', (e) => { state.mode = e.target.value; savePrefs(); if (state.ctx) { recompute(); renderEditor(); if (!state.cleaned) schedulePreview(); } });
  const qIn = $('#q');
  qIn.addEventListener('input', () => { state.q = qIn.value.trim(); state.hitPos = -1; state.shown.hits = 30; $('#qClear').hidden = !qIn.value; renderSide(); if (state.q && mq('(max-width:899px)')) setView('tools'); });
  qIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && state.hits.length) { state.hitPos = (state.hitPos + 1) % state.hits.length; jumpTo(state.hits[state.hitPos].el); }
    if (e.key === 'Escape') { qIn.value = ''; qIn.dispatchEvent(new Event('input')); }
  });
  $('#qClear').addEventListener('click', () => { qIn.value = ''; qIn.dispatchEvent(new Event('input')); qIn.focus(); });
  document.addEventListener('keydown', (e) => {
    if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey) && !e.shiftKey && state.lastOp === 'struct' && state.undoStack.length && e.target.closest && e.target.closest('#paneEditor')) { e.preventDefault(); undoLast(); return; }
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (e.key === '/' && !typing && !e.ctrlKey && !e.metaKey) { e.preventDefault(); qIn.focus(); }
  });
  document.querySelectorAll('.mtabs button').forEach((b) => b.addEventListener('click', () => setView(b.dataset.view)));
  const pane = $('#paneEditor');
  pane.addEventListener('dragover', (e) => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); });
  pane.addEventListener('dragleave', () => { const d = $('#drop'); if (d) d.classList.remove('over'); });
  pane.addEventListener('drop', (e) => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); openFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
  window.addEventListener('beforeunload', (e) => { if (state.ctx && state.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // 아이콘이 붙은 버튼의 글자 노드를 되돌리기 버튼에서 찾을 수 있도록 보장
  if (rv.lastChild.nodeType !== 3) rv.append(document.createTextNode(''));

  renderAll();
  getDownloads();
  window.__app = { state, mount, runClean, renderEditor, renderSide, structural, jumpTo, currentRules, enterAt, setEdMode, buildCmp, undoLast, exportBytes: () => E.save(state.ctx, currentRules(), { JSZip: window.JSZip, DOMParser: window.DOMParser, XMLSerializer: window.XMLSerializer }) };
})();
</script>
<script>
/* 관리자 사이트 안(iframe)에서 쓰일 때: 작업 중임을 알려 자동 로그아웃(1시간 미사용)이 작업 도중에 걸리지 않게 한다 */
(function(){if(window.parent===window)return;document.documentElement.setAttribute('data-theme','light');let t=0;
['keydown','pointerdown','input','scroll','wheel'].forEach(function(ev){addEventListener(ev,function(){const n=Date.now();if(n-t>5000){t=n;try{parent.postMessage({t:'yw-act'},location.origin)}catch(e){}}},{passive:true,capture:true})})})();
</script>
</body>
</html>
