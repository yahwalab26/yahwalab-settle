const payMonth=pm=>{const y=+pm.slice(0,4),m=+pm.slice(5,7)-1+2;return{y:y+Math.floor(m/12),m:m%12}};

async function loadFil(){const r=await SB.from('app_settings').select('key,value').like('key','tax_filings:%');if(r.error)throw r.error;FIL={};(r.data||[]).forEach(x=>{FIL[x.key.slice(12)]=x.value||{}})}
async function saveItem(month,id,patch){const k=fkey(month),r=await SB.from('app_settings').select('value').eq('key',k).maybeSingle();if(r.error)throw r.error;   /* 저장 직전에 다시 읽어 다른 기기의 변경을 덮어쓰지 않음 */
  const v=(r.data&&r.data.value)||{v:1,items:{}};v.items=v.items||{};const cur=v.items[id]||{done:false,date:'',memo:'',log:[]},now=new Date().toISOString(),nx={...cur,...patch,upd:now};

function draw(key){const g=G.get(key);if(!g)return;const c=calc(g),today=iso(kst()),s=sched(g.y,g.m),T=c.tot,mm=g.m+1;

<li>제출연월 ${s.tax.getUTCFullYear()}-${String(s.tax.getUTCMonth()+1).padStart(2,'0')}, 귀속연월·지급연월 <b>${g.y}-${String(mm).padStart(2,'0')}</b>, 원천징수신고구분 매월, 신고구분 정기</li>
<li>소득종류 <b>사업소득</b> 체크 → <b>A25 매월징수</b> 줄에 아래 값을 입력, A30·A99에 같은 금액이 나오는지 확인</li>
<li>환급세액·부표는 보통 0 / 없음. 신고서 제출 후 <b>납부</b>까지 해야 합니다(신고만 하면 가산세).</li></ol>
<div class="kv"><span>인원</span><span></span><span class="v">${T.cnt}명</span>
<span>총지급액</span><span></span><span class="v">${n0(T.A)} ${cp(T.A)}</span>
<span>소득세</span><span></span><span class="v">${n0(T.inc)} ${cp(T.inc)}</span></div>${chk(key,1)}</div>

<div class="sec"><div class="sh"><h2>2. 지방소득세 특별징수 신고·납부</h2>${secTag(key,2,s.tax,today)}</div>
<ol class="step"><li>서울 사업장은 서울시 ETAX, 서울 밖은 위택스에서 신고·납부합니다.</li>
<li>서울시 ETAX: 신고납부 &gt; 지방소득세 &gt; <b>특별징수분</b></li>
<li>소득세 신고와 별도로 신고·납부해야 하며, 금액은 소득세의 10%입니다.</li></ol>
<div class="kv"><span>지방소득세 합계</span><span></span><span class="v">${n0(T.loc)} ${cp(T.loc)}</span></div>${chk(key,2)}</div>

<div class="sec"><div class="sh"><h2>3. 간이지급명세서 (사업소득)</h2>${secTag(key,3,s.stmt,today)}</div>
<ol class="step"><li>홈택스 &gt; 지급명세서·자료제출 &gt; <b>간이지급명세서(거주자의 사업소득)</b>, 제출구분 정기신고, 지급연도·지급월 <b>${g.y}년 ${mm}월</b></li>
<li>작가별로 내국인·주민등록번호·성명, 업종구분 <b>저술가</b>, 귀속연도·월, 지급액·소득세·지방소득세를 입력합니다.</li>
<li>전체 성명은 아래 <b>작가 실명 보기</b>를 눌러야 표시됩니다(평소에는 마스킹). 주민등록번호는 <b>주민번호 보기</b>를 누르면 60초 동안만 표시됩니다(열람 기록이 남습니다). <b>미등록</b>으로 나오는 작가는 작가 관리에서 수정 화면의 주민등록번호 칸에 입력해 두세요.</li></ol>
${chk(key,3)}<div class="sh" style="margin:10px 0 6px"><span class="k">작가별 금액 (단위: 원)</span><span><button type="button" data-real>${showReal?'실명 숨기기':'작가 실명 보기'}</button> <button type="button" data-rrn>${RRN?'주민번호 숨기기':'주민번호 보기 (60초)'}</button> ${cp(tsv,'표 복사(엑셀용)')}</span></div>${[realMsg,rrnMsg].filter(Boolean).map(m=>`<div class="note ${m.err?'err':'info'}">${esc(m.t)}</div>`).join('')}
<div class="scroll"><table><thead><tr><th>작가</th>${RRN?'<th>주민등록번호</th>':''}<th>지급액</th><th>소득세</th><th>지방소득세</th><th>계</th><th>실지급액</th><th>정산 사이트 대비</th></tr></thead><tbody>${rows}</tbody>
<tfoot><tr><td>합계 ${T.cnt}명</td>${RRN?'<td></td>':''}<td>${n0(T.A)}</td><td>${n0(T.inc)}</td><td>${n0(T.loc)}</td><td>${n0(T.all)}</td><td>${n0(T.pay)}</td><td></td></tr></tfoot></table></div></div>

<div class="foot">계산 규칙: 소득세 = 지급액의 3%를 10원 미만 내림, 지방소득세 = 소득세의 10%를 10원 미만 내림(홈택스 입력 화면 실측). 지급월 = 판매월의 익익월, 입금일은 말일(휴일이면 앞 영업일), 신고 기한은 휴일이면 다음 영업일입니다. 세법 적용은 국세청·홈택스 안내를 최종 기준으로 확인해 주세요.<br>완료 체크의 메모에는 접수번호 등만 적고, 주민등록번호 같은 개인정보는 적지 마세요.</div>`}
function fill(){const keys=[...G.keys()].sort().reverse(),today=iso(kst());
  const up=[...keys].reverse().find(k=>{const g=G.get(k);return iso(sched(g.y,g.m).stmt)>=today});
  $('#mon').innerHTML=keys.map(k=>{const g=G.get(k);return`<option value="${k}">${ym(k)} 지급분 · ${ym(g.period)} 판매분</option>`}).join('');
  $('#mon').value=up||keys[0];$('#selw').hidden=false;draw($('#mon').value)}
async function init(){
  try{const{data:{session}}=await SB.auth.getSession();
    if(!session)return gate('로그인이 필요합니다. 정산 사이트에서 로그인한 뒤 이 화면을 새로고침해 주세요.',true);
    const pf=await SB.from('profiles').select('role').eq('id',session.user.id).maybeSingle();
    if(pf.error||!pf.data||pf.data.role==='author')return gate('관리자만 볼 수 있는 화면입니다.',true);
    const[a,b]=await Promise.all([SB.from('settlements').select('person_id,period_month,status,author_total,tax_amount').order('period_month',{ascending:false}),SB.from('persons').select('id,name_masked')]);
    if(a.error||b.error)return gate('데이터를 불러오지 못했습니다: '+((a.error||b.error).message||'알 수 없는 오류'));
    (b.data||[]).forEach(x=>{names[x.id]=x.name_masked});
    const all=a.data||[];DRAFT=all.filter(r=>r.status==='draft');
    try{await loadFil()}catch(e){FIL={}}
    G=group(all.filter(r=>r.status==='confirmed'||r.status==='sent'),names);
    if(!G.size)return gate('확정된 정산이 아직 없습니다. 정산 화면에서 정산을 확정하면 이곳에 나타납니다.');
    fill()}catch(e){gate('화면을 불러오는 중 오류가 났습니다: '+String(e&&e.message||e))}}
$('#mon').addEventListener('change',e=>{hideRrn();rrnMsg=null;realMsg=null;draw(e.target.value)});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-cp]');if(!b)return;const v=b.getAttribute('data-cp');
  try{await navigator.clipboard.writeText(v)}catch(x){const t=document.createElement('textarea');t.value=v;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(y){}t.remove()}
  const o=b.textContent;b.textContent='복사됨';b.classList.add('done');setTimeout(()=>{b.textContent=o;b.classList.remove('done')},1200)});
async function act(id,key,patch,onFail){if(busy)return;busy=true;const st=document.querySelector('[data-st="'+id+'"]');if(st){st.className='k';st.textContent='저장 중…'}
  try{await saveItem(key,id,patch);draw(key)}catch(e){if(onFail)onFail();const s2=document.querySelector('[data-st="'+id+'"]');if(s2){s2.className='bad';s2.textContent='저장 실패: '+String(e&&e.message||e)}}finally{busy=false}}
document.addEventListener('change',e=>{const c=e.target.closest('[data-ck]');if(!c)return;const id=c.getAttribute('data-ck'),row=c.closest('.ck'),dt=row.querySelector('[data-dt]').value,m=row.querySelector('[data-mm]').value;
  act(id,$('#mon').value,c.checked?{done:true,date:dt||iso(kst()),memo:m}:{done:false},()=>{c.checked=!c.checked})});
document.addEventListener('click',e=>{const b=e.target.closest('[data-sv]');if(!b)return;const id=b.getAttribute('data-sv'),row=b.closest('.ck');act(id,$('#mon').value,{date:row.querySelector('[data-dt]').value,memo:row.querySelector('[data-mm]').value})});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-real],[data-rrn]');if(!b||busy)return;const key=$('#mon').value,isReal=b.hasAttribute('data-real');
  if(isReal&&showReal){showReal=false;realMsg=null;draw(key);return}
  if(!isReal&&RRN){hideRrn();rrnMsg=null;draw(key);return}
  busy=true;b.disabled=true;b.textContent='불러오는 중…';
  const g=G.get(key),act=g?calc(g).act:[];
  try{
    if(isReal){if(!Object.keys(REAL).length)await loadReal();showReal=true;const n=act.filter(p=>REAL[p.id]).length;realMsg={t:n===act.length?`작가 실명 ${n}명을 불러왔습니다.`:`작가 실명 ${n}/${act.length}명만 불러왔습니다. 나머지는 작가 정보에 실명이 없습니다.`,err:n<act.length}}
    else{await loadRrn(act.map(p=>p.id));const n=act.filter(p=>RRN[p.id]).length;rrnMsg={t:n===act.length?`주민등록번호 ${n}명을 불러왔습니다. 60초 뒤 자동으로 숨깁니다.`:`주민등록번호 ${n}/${act.length}명만 등록되어 있습니다. 미등록 작가는 작가 관리 > 수정에서 입력해 주세요. 60초 뒤 자동으로 숨깁니다.`,err:n<act.length}}
  }catch(x){const m=hint(String(x&&x.message||x));if(isReal)realMsg={t:'실명을 불러오지 못했습니다: '+m,err:true};else rrnMsg={t:'주민등록번호를 불러오지 못했습니다: '+m,err:true}}
  busy=false;draw(key)});
/* 정산 사이트 안에 끼워 넣어 쓸 때 '사용 중'임을 알려 자동 로그아웃을 막음(mailer.html과 같은 방식) */
let t0=0;['keydown','pointerdown','scroll','wheel'].forEach(ev=>addEventListener(ev,()=>{const n=Date.now();if(n-t0>5000){t0=n;try{parent!==window&&parent.postMessage({t:'yw-act'},location.origin)}catch(e){}}},{passive:true,capture:true}));
init();
})();
</script>
</body>
</html>
