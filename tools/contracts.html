<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https://wddixxdrndgvjgicwunu.supabase.co; connect-src 'self' https://wddixxdrndgvjgicwunu.supabase.co wss://wddixxdrndgvjgicwunu.supabase.co; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>야화랩 전자계약</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F3F3F4;--paper:#fff;--ink:#17171A;--ink2:#46474D;--mute:#6A6B73;--line:#D6D7DB;--line2:#E8E8EB;--hl:#EDEDF0;--red:#C4251B;--redbg:#FBE9E7;--ok:#1F7A3E;--okbg:#E7F4EC;--warn:#8A5A00;--warnbg:#FFF4D6;--focus:#2F6FDE;
--ui:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--ui);-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}h1{font-size:20px;margin:0 0 4px;font-weight:700}h2{font-size:15px;margin:0 0 8px}
.k{color:var(--mute);font-size:12.5px}.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
select,input[type=text],input[type=date],input[type=email],input[type=number]{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:0 8px;font:inherit;color:var(--ink);max-width:100%;width:100%}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
button{font:inherit;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;cursor:pointer;margin:2px 4px 2px 0}button:hover{background:var(--hl)}
button.p{background:var(--ink);color:#fff;border-color:var(--ink)}button:disabled{opacity:.5;cursor:default}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.g label{font-size:12.5px;color:var(--mute);display:block;margin-bottom:3px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}th{font-weight:600;color:var(--ink2);background:var(--bg);font-size:12.5px}
tr.r{cursor:pointer}tr.r:hover{background:var(--hl)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--ink2);background:var(--paper)}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}.tag.bad{background:var(--redbg);color:var(--red);border-color:transparent}
.note{border-radius:7px;padding:10px 12px;margin:0 0 12px;font-size:13px}.note.err{background:var(--redbg);color:var(--red)}.note.info{background:var(--hl);color:var(--ink2)}
.gate{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:24px;text-align:center}
.foot{color:var(--mute);font-size:12px;margin-top:14px;line-height:1.7}.mono{font-variant-numeric:tabular-nums}
@media(max-width:560px){.wrap{padding:16px 12px 48px}}
</style>
</head>
<body>
<div class="wrap" id="root"><div class="gate">불러오는 중…</div></div>
<script src="/libs/supabase-2.49.4.js"></script>
<script src="/tools/contracts.js?v=1.0.0"></script>
</body>
</html>
